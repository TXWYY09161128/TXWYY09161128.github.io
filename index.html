<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星 · A QUIET PLACE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f8f7f2;
    color:#3f3b45;
    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    overflow-x:hidden;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:50px 25px;
}

/* 左上 */

.top-left{
    position:absolute;
    left:35px;
    top:30px;
    font-size:9px;
    line-height:1.8;
    letter-spacing:3px;
    color:#aaa5af;
    z-index:10;
}

/* 右上 */

.top-right{
    position:absolute;
    right:35px;
    top:30px;
    font-size:9px;
    line-height:1.8;
    letter-spacing:3px;
    color:#aaa5af;
    text-align:right;
    z-index:10;
}

/* =========================
   原来的轨道
========================= */

.orbit{
    width:500px;
    height:500px;
    border:1px solid rgba(120,110,130,.09);
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-15deg);
    z-index:0;
}

/* =========================
   原来的拱门
   只把紫色换成第三张照片
========================= */

.arch{
    width:min(390px,62vw);
    height:min(510px,65vh);
    min-height:330px;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-45%);

    z-index:2;

    overflow:hidden;

    border-radius:220px 220px 0 0;

    box-shadow:
        0 35px 80px rgba(60,52,72,.16);

    opacity:0;

    animation:
        archIn 1.8s .25s cubic-bezier(.2,.8,.2,1) forwards;
}

/* 第三张照片 */

.arch img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
    object-position:center;
}

/* 拱门上的轻微光感 */

.arch::after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:inherit;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.12),
            transparent 45%
        );

    pointer-events:none;
}

/* =========================
   月亮
========================= */

.moon{
    position:absolute;

    width:72px;
    height:72px;

    border-radius:50%;

    background:#f7e7a9;

    box-shadow:
        0 0 30px rgba(247,231,169,.55);

    right:calc(50% - 245px);
    top:calc(50% - 230px);

    z-index:5;

    opacity:0;

    animation:
        moonIn 1.3s .9s forwards,
        moonFloat 5s 2.2s ease-in-out infinite;
}

.moon::after{
    content:"";

    position:absolute;

    width:72px;
    height:72px;

    border-radius:50%;

    background:#b0a2d4;

    left:20px;
    top:-7px;
}

/* =========================
   星星
========================= */

.star{
    position:absolute;
    color:#aaa1bd;
    z-index:6;
    opacity:0;
}

.s1{
    left:calc(50% - 250px);
    top:calc(50% - 180px);
    font-size:16px;
    animation:starIn 1s 1.2s forwards;
}

.s2{
    right:calc(50% - 270px);
    top:calc(50% + 100px);
    font-size:20px;
    animation:starIn 1s 1.5s forwards;
}

.s3{
    left:calc(50% + 210px);
    top:calc(50% - 80px);
    font-size:25px;
    animation:starIn 1s 1.7s forwards;
}

/* =========================
   HERO 文字
   全部放到拱门外
========================= */

.hero-center{
    width:100%;
    max-width:900px;

    text-align:center;

    position:absolute;

    left:50%;
    top:calc(50% + min(285px,36vh));

    transform:translateX(-50%);

    z-index:7;
}

/* A QUIET PLACE */

.kicker{
    font-size:10px;
    letter-spacing:7px;
    color:#aaa5af;

    margin-bottom:18px;

    opacity:0;

    animation:
        fadeUp 1.2s .1s forwards;
}

/* 删除原来的「圆落星」 */

.hero-sub{
    margin-top:0;

    font-size:11px;
    letter-spacing:5px;
    color:#aaa5af;

    opacity:0;

    animation:
        fadeUp 1.2s .4s forwards;
}

/* ENTER */

.enter{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:25px;

    padding:14px 28px;

    border:1px solid rgba(72,67,81,.25);

    border-radius:50px;

    text-decoration:none;

    font-size:10px;
    letter-spacing:3px;

    color:#514c58;

    background:rgba(255,255,255,.25);

    transition:
        background .4s,
        transform .4s,
        border-color .4s;

    opacity:0;

    animation:
        fadeUp 1.2s .7s forwards;
}

.enter:hover{
    background:rgba(255,255,255,.7);
    transform:translateY(-2px);
    border-color:rgba(72,67,81,.45);
}

/* 时间 */

.datetime{
    margin-top:16px;

    font-size:12px;
    letter-spacing:1px;

    color:#8f8995;
}

.day-counter{
    margin-top:8px;

    font-size:10px;
    letter-spacing:2px;

    color:#b0abb2;
}

/* =========================
   动画
========================= */

@keyframes archIn{
    from{
        opacity:0;
        transform:translate(-50%,-40%) scale(.88);
    }

    to{
        opacity:1;
        transform:translate(-50%,-45%) scale(1);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes moonIn{
    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes moonFloat{
    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-8px;
    }
}

@keyframes starIn{
    from{
        opacity:0;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   TODAY
========================= */

.section{
    min-height:100vh;
    padding:120px 25px;
    position:relative;
}

.section-inner{
    max-width:1000px;
    margin:0 auto;
}

.section-label{
    font-size:10px;
    letter-spacing:5px;
    color:#aaa5af;
    margin-bottom:25px;
}

.section-title{
    font-size:42px;
    font-weight:300;
    letter-spacing:3px;
    color:#4a4653;
}

.today-grid{
    margin-top:70px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.today-card{
    min-height:220px;

    padding:35px;

    background:
        rgba(255,255,255,.55);

    border:1px solid rgba(80,70,90,.08);

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.today-card-label{
    font-size:9px;
    letter-spacing:4px;
    color:#aaa5af;
}

.today-card-main{
    font-size:25px;
    font-weight:300;
    color:#514c58;
}

.today-card-sub{
    font-size:11px;
    letter-spacing:1px;
    color:#99929f;
}

/* =========================
   PHOTO
========================= */

.photo-section{
    min-height:100vh;
    padding:120px 0;
    overflow:hidden;
}

.photo-title{
    max-width:1000px;
    margin:0 auto 55px;

    padding:0 25px;
}

.photo-title-label{
    font-size:10px;
    letter-spacing:5px;
    color:#aaa5af;
    margin-bottom:20px;
}

.photo-title-main{
    font-size:42px;
    font-weight:300;
    letter-spacing:3px;
    color:#4a4653;
}

/* 横向照片 */

.photo-track{
    display:flex;
    width:max-content;

    animation:
        photoScroll 45s linear infinite;
}

.photo-item{
    width:300px;
    height:400px;

    margin-right:20px;

    flex-shrink:0;

    overflow:hidden;
}

.photo-item img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .7s ease;
}

.photo-item:hover img{
    transform:scale(1.04);
}

@keyframes photoScroll{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;

    inset:0;

    background:rgba(25,22,30,.92);

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .4s,
        visibility .4s;

    z-index:100;
}

.lightbox.active{
    opacity:1;
    visibility:visible;
}

.lightbox img{
    max-width:90vw;
    max-height:90vh;

    object-fit:contain;
}

.lightbox-close{
    position:absolute;

    right:30px;
    top:25px;

    color:white;

    font-size:25px;

    cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:70px 25px;

    text-align:center;

    font-size:9px;

    letter-spacing:4px;

    color:#aaa5af;
}

/* =========================
   SCROLL 动画
========================= */

.reveal{
    opacity:0;
    transform:translateY(30px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   手机
========================= */

@media(max-width:700px){

    .hero{
        min-height:100vh;
        padding:40px 20px;
    }

    .top-left{
        left:20px;
        top:20px;
    }

    .top-right{
        right:20px;
        top:20px;
    }

    .arch{
        width:68vw;
        height:55vh;
    }

    .orbit{
        width:380px;
        height:380px;
    }

    .hero-center{
        top:calc(50% + min(255px,31vh));
    }

    .today-grid{
        grid-template-columns:1fr;
    }

    .section-title,
    .photo-title-main{
        font-size:34px;
    }

    .photo-item{
        width:240px;
        height:320px;
    }

    .moon{
        right:calc(50% - 155px);
        top:calc(50% - 190px);
        width:55px;
        height:55px;
    }

    .moon::after{
        width:55px;
        height:55px;
    }

    .s1{
        left:18%;
    }

    .s2{
        right:15%;
    }

    .s3{
        left:75%;
    }
}
</style>
</head>

<body>

<!-- =========================
     HERO
========================= -->

<header class="hero">

    <div class="top-left">
        2026<br>
        ✦ LIGHT · NIGHT
    </div>

    <div class="top-right">
        SHINING<br>
        IN SILENCE
    </div>

    <div class="orbit"></div>

    <!-- 第三张照片，完全放在原来的拱门位置 -->
    <div class="arch">
        <img src="photos/IMG_5778.jpeg" alt="Memory">
    </div>

    <div class="moon"></div>

    <div class="star s1">✦</div>
    <div class="star s2">✧</div>
    <div class="star s3">·</div>

    <!-- 所有文字都在拱门外 -->
    <div class="hero-center">

        <div class="kicker">
            A QUIET PLACE
        </div>

        <div class="hero-sub">
            A PLACE FOR MEMORY
        </div>

        <a href="#today" class="enter">
            ENTER MY WORLD →
        </a>

        <div class="datetime" id="datetime">
            正在读取时间…
        </div>

        <div class="day-counter" id="dayCounter"></div>

    </div>

</header>


<!-- =========================
     TODAY
========================= -->

<section class="section" id="today">

    <div class="section-inner">

        <div class="section-label">
            TODAY
        </div>

        <div class="section-title">
            A QUIET DAY
        </div>

        <div class="today-grid">

            <div class="today-card reveal">

                <div class="today-card-label">
                    MOON
                </div>

                <div class="today-card-main">
                    月相
                </div>

                <div class="today-card-sub">
                    今夜的月亮
                </div>

            </div>

            <div class="today-card reveal">

                <div class="today-card-label">
                    SEASON
                </div>

                <div class="today-card-main">
                    秋
                </div>

                <div class="today-card-sub">
                    一年四季
                </div>

            </div>

            <div class="today-card reveal">

                <div class="today-card-label">
                    SHANGHAI
                </div>

                <div class="today-card-main">
                    上海
                </div>

                <div class="today-card-sub">
                    WEATHER
                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     PHOTO
========================= -->

<section class="photo-section">

    <div class="photo-title">

        <div class="photo-title-label">
            MEMORIES
        </div>

        <div class="photo-title-main">
            LITTLE MOMENTS
        </div>

    </div>

    <div class="photo-track" id="photoTrack"></div>

</section>


<!-- =========================
     LIGHTBOX
========================= -->

<div class="lightbox" id="lightbox">

    <div class="lightbox-close" id="lightboxClose">
        ×
    </div>

    <img id="lightboxImg" src="" alt="">

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>
    A QUIET PLACE · 圆落星
</footer>


<script>

/* =========================
   时间
========================= */

function updateDateTime(){

    const now = new Date();

    const year = now.getFullYear();

    const month =
        String(now.getMonth()+1).padStart(2,"0");

    const day =
        String(now.getDate()).padStart(2,"0");

    const hour =
        String(now.getHours()).padStart(2,"0");

    const minute =
        String(now.getMinutes()).padStart(2,"0");

    const second =
        String(now.getSeconds()).padStart(2,"0");

    const el =
        document.getElementById("datetime");

    if(el){

        el.textContent =
            `${year}.${month}.${day} · ${hour}:${minute}:${second}`;

    }

}

updateDateTime();

setInterval(updateDateTime,1000);


/* =========================
   天数
========================= */

const startDate =
    new Date("2026-01-01T00:00:00");

function updateDayCounter(){

    const now = new Date();

    const diff =
        now - startDate;

    const days =
        Math.floor(
            diff / (1000*60*60*24)
        ) + 1;

    const el =
        document.getElementById("dayCounter");

    if(el){

        el.textContent =
            `DAY ${days} OF 2026`;

    }

}

updateDayCounter();


/* =========================
   照片
========================= */

const photoTrack =
    document.getElementById("photoTrack");

fetch("photos.json?v=" + Date.now())

    .then(response => response.json())

    .then(photos => {

        const allPhotos =
            photos.concat(photos);

        allPhotos.forEach(src => {

            const item =
                document.createElement("div");

            item.className =
                "photo-item";

            const img =
                document.createElement("img");

            img.src = src;

            img.loading = "lazy";

            item.appendChild(img);

            item.addEventListener(
                "click",
                () => openLightbox(src)
            );

            photoTrack.appendChild(item);

        });

    })

    .catch(error => {

        console.error(
            "照片读取失败:",
            error
        );

    });


/* =========================
   LIGHTBOX
========================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImg =
    document.getElementById("lightboxImg");

const lightboxClose =
    document.getElementById("lightboxClose");


function openLightbox(src){

    lightboxImg.src =
        src;

    lightbox.classList.add(
        "active"
    );

}


function closeLightbox(){

    lightbox.classList.remove(
        "active"
    );

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    function(e){

        if(e.target === lightbox){

            closeLightbox();

        }

    }
);


/* =========================
   滚动出现
========================= */

const reveals =
    document.querySelectorAll(".reveal");


const observer =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if(entry.isIntersecting){

                    entry.target.classList.add(
                        "show"
                    );

                }

            });

        },
        {
            threshold:.15
        }
    );


reveals.forEach(
    el => observer.observe(el)
);

</script>

</body>
</html>
