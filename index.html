<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050711;
    color:#f5f2ea;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    overflow-x:hidden;
}

/* =========================
   星空主屏
========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 70% 25%,
            rgba(102,126,190,.20),
            transparent 25%
        ),
        radial-gradient(
            circle at 25% 70%,
            rgba(88,72,130,.16),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #080b18 0%,
            #050711 55%,
            #11152a 100%
        );
}

/* 星星层 */

.stars,
.stars2,
.stars3{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.stars{
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(180,200,255,.7) 1px,transparent 1.5px);

    background-size:
        150px 150px,
        230px 230px,
        310px 310px;

    background-position:
        10px 30px,
        80px 120px,
        150px 50px;

    animation:starsMove 35s linear infinite;
    opacity:.65;
}

.stars2{
    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 1.2px,transparent 2px),
        radial-gradient(circle,rgba(170,190,255,.7) 1px,transparent 1.7px);

    background-size:
        270px 270px,
        390px 390px;

    background-position:
        40px 100px,
        180px 20px;

    animation:starsMove 55s linear infinite reverse;
    opacity:.45;
}

.stars3{
    background-image:
        radial-gradient(circle,rgba(255,244,190,.9) 1.5px,transparent 2.5px);

    background-size:430px 430px;
    background-position:210px 80px;

    animation:twinkle 4s ease-in-out infinite;
}


/* 月亮 */

.moon{
    position:absolute;

    width:210px;
    height:210px;

    right:10%;
    top:15%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffdf3 0%,
            #e9e4cf 48%,
            #aaa68f 100%
        );

    box-shadow:
        0 0 35px rgba(240,235,205,.22),
        0 0 100px rgba(120,145,220,.13);

    animation:moonFloat 8s ease-in-out infinite;
}

.moon::after{
    content:"";

    position:absolute;

    width:210px;
    height:210px;

    border-radius:50%;

    background:#080b18;

    left:65px;
    top:-12px;
}


/* =========================
   日期时间
========================= */

.time{
    position:absolute;

    top:42px;
    right:7%;

    text-align:right;
    z-index:10;

    animation:fadeDown 1.2s ease both;
}

#date{
    display:block;

    font-family:Georgia,"Times New Roman",serif;

    font-size:13px;
    letter-spacing:4px;

    color:#aaaec4;

    margin-bottom:8px;
}

#clock{
    display:block;

    font-family:Georgia,"Times New Roman",serif;

    font-size:24px;
    letter-spacing:3px;

    color:#f5f2ea;
}


/* =========================
   主文字
========================= */

.content{
    width:min(1000px,86%);
    margin-left:9%;

    position:relative;
    z-index:5;

    animation:fadeUp 1.5s .2s ease both;
}

.small{
    font-size:10px;

    letter-spacing:7px;

    color:#9da4c2;

    margin-bottom:35px;
}

h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(80px,13vw,170px);

    font-weight:400;

    letter-spacing:-8px;

    line-height:.9;

    margin-bottom:40px;

    text-shadow:
        0 0 35px rgba(170,190,255,.12);
}

.line{
    width:85px;
    height:1px;

    background:#8993bb;

    margin-bottom:30px;

    animation:lineIn 1.5s .8s ease both;
}

.description{
    max-width:520px;

    font-size:15px;

    line-height:2.1;

    letter-spacing:1px;

    color:#a8acbd;
}

.enter{
    display:inline-block;

    margin-top:48px;

    padding:17px 32px;

    border:1px solid rgba(180,190,220,.45);

    color:#eeeef4;

    text-decoration:none;

    font-size:10px;

    letter-spacing:4px;

    transition:.4s;
}

.enter:hover{
    background:#eeeef4;
    color:#080b18;

    transform:translateY(-4px);

    box-shadow:
        0 10px 35px rgba(150,170,230,.12);
}


/* =========================
   装饰数字
========================= */

.number{
    position:absolute;

    right:7%;
    bottom:6%;

    font-family:Georgia,"Times New Roman",serif;

    font-size:130px;

    color:rgba(255,255,255,.035);

    z-index:2;

    animation:numberFloat 7s ease-in-out infinite;
}


/* =========================
   第二屏
========================= */

.memory{
    min-height:90vh;

    padding:130px 9%;

    display:flex;
    align-items:center;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(94,109,170,.12),
            transparent 30%
        ),
        #070912;

    color:#eeeef2;
}

.memory-inner{
    width:min(1000px,100%);
    margin:auto;
}

.label{
    font-size:10px;

    letter-spacing:6px;

    color:#7e86a7;

    margin-bottom:42px;
}

.quote{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(36px,5vw,70px);

    font-weight:400;

    line-height:1.35;

    max-width:900px;

    text-shadow:
        0 0 30px rgba(180,190,230,.08);
}

.bottom{
    margin-top:100px;

    padding-top:22px;

    border-top:1px solid rgba(255,255,255,.12);

    display:flex;
    justify-content:space-between;

    font-size:9px;

    letter-spacing:4px;

    color:#6f748b;
}


/* =========================
   动画
========================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(45px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes lineIn{
    from{
        width:0;
        opacity:0;
    }

    to{
        width:85px;
        opacity:1;
    }
}

@keyframes starsMove{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-80px,50px);
    }
}

@keyframes twinkle{
    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.9;
    }
}

@keyframes moonFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

@keyframes numberFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}


/* =========================
   手机
========================= */

@media(max-width:600px){

    .hero{
        min-height:720px;
    }

    .content{
        width:82%;
        margin-left:9%;
    }

    h1{
        font-size:78px;
        letter-spacing:-5px;
    }

    .small{
        letter-spacing:5px;
    }

    .description{
        font-size:14px;
    }

    .moon{
        width:130px;
        height:130px;

        right:-20px;
        top:17%;
    }

    .moon::after{
        width:130px;
        height:130px;

        left:40px;
        top:-8px;
    }

    .time{
        top:28px;
        right:8%;
    }

    #date{
        font-size:10px;
        letter-spacing:2px;
    }

    #clock{
        font-size:19px;
    }

    .number{
        font-size:80px;
        right:8%;
    }

    .memory{
        min-height:80vh;
        padding:100px 10%;
    }

    .quote{
        font-size:34px;
    }

    .bottom{
        margin-top:70px;

        flex-direction:column;

        gap:14px;
    }
</style>
</head>

<body>

<section class="hero">

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div class="moon"></div>


    <!-- 自动日期和时间 -->

    <div class="time">

        <span id="date">
            2026.09.26
        </span>

        <span id="clock">
            00:00:00
        </span>

    </div>


    <div class="content">

        <div class="small">
            A QUIET PLACE
        </div>


        <h1>
            圆落星
        </h1>


        <div class="line"></div>


        <div class="description">

            把喜欢的人、事、照片和那些<br>

            不想忘记的瞬间，慢慢留在这里。

        </div>


        <a
            href="#memory"
            class="enter"
        >
            ENTER MY WORLD →
        </a>

    </div>


    <div class="number">
        01
    </div>

</section>


<section
    class="memory"
    id="memory"
>

    <div class="memory-inner">

        <div class="label">
            TODAY
        </div>


        <div class="quote">

            “有些瞬间不需要被解释，<br>

            只需要被好好留下。”

        </div>


        <div class="bottom">

            <span>
                A PLACE FOR MEMORY
            </span>

            <span>
                2026
            </span>

        </div>

    </div>

</section>


<script>

/* =========================
   中国时间
========================= */

function updateTime(){

    const now = new Date();


    const date =
        new Intl.DateTimeFormat(
            "zh-CN",
            {
                timeZone:"Asia/Shanghai",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        )
        .format(now)
        .replace(/\//g,".");


    const time =
        new Intl.DateTimeFormat(
            "zh-CN",
            {
                timeZone:"Asia/Shanghai",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:false
            }
        )
        .format(now);


    document.getElementById("date")
        .textContent = date;

    document.getElementById("clock")
        .textContent = time;

}


updateTime();

setInterval(
    updateTime,
    1000
);

</script>

</body>
</html>
