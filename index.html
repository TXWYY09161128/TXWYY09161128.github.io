<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f1ec;
    color:#403c45;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#181c2b;
}

.hero-bg{
    position:absolute;
    inset:0;
    z-index:0;

    background-size:cover;
    background-position:center;

    transition:
        opacity 1.2s ease,
        transform 8s ease;

    transform:scale(1.03);
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;

    background:
        linear-gradient(
            to bottom,
            rgba(8,12,24,.18),
            rgba(8,12,24,.08) 45%,
            rgba(8,12,24,.48) 100%
        );
}

.hero-center{
    width:90%;
    max-width:900px;

    position:relative;
    z-index:5;

    text-align:center;

    color:#fff;

    text-shadow:
        0 3px 25px rgba(0,0,0,.45);
}

.top-left,
.top-right{
    position:absolute;
    top:38px;
    z-index:6;

    font-size:9px;
    line-height:1.9;
    letter-spacing:3px;

    color:rgba(255,255,255,.82);
}

.top-left{
    left:5%;
}

.top-right{
    right:5%;
    text-align:right;
}

.kicker{
    font-size:10px;
    letter-spacing:8px;

    margin-bottom:20px;

    opacity:0;
    animation:
        fadeUp 1.2s .15s forwards;
}

.hero-title{
    font-size:
        clamp(
            58px,
            9vw,
            105px
        );

    font-weight:300;

    letter-spacing:13px;

    opacity:0;
    animation:
        fadeUp 1.3s .3s forwards;
}

.hero-sub{
    margin-top:15px;

    font-size:10px;
    letter-spacing:6px;

    opacity:0;
    animation:
        fadeUp 1.2s .45s forwards;
}

.enter{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:45px;

    padding:
        14px
        30px;

    border:
        1px solid
        rgba(255,255,255,.65);

    border-radius:50px;

    color:#fff;

    background:
        rgba(255,255,255,.10);

    backdrop-filter:blur(8px);

    text-decoration:none;

    font-size:10px;
    letter-spacing:3px;

    transition:.4s;

    opacity:0;

    animation:
        fadeUp 1.2s .65s forwards;
}

.enter:hover{
    background:
        rgba(255,255,255,.2);

    transform:
        translateY(-3px);
}

.datetime{
    margin-top:40px;

    font-size:11px;
    letter-spacing:2px;

    color:
        rgba(255,255,255,.92);
}

.day-counter{
    margin-top:9px;

    font-size:10px;
    letter-spacing:2px;

    color:
        rgba(255,255,255,.72);
}

.place-tag{
    position:absolute;

    left:50%;
    bottom:34px;

    transform:
        translateX(-50%);

    z-index:6;

    padding:
        8px 16px;

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius:30px;

    background:
        rgba(0,0,0,.18);

    backdrop-filter:blur(8px);

    color:
        rgba(255,255,255,.85);

    font-size:8px;
    letter-spacing:3px;

    white-space:nowrap;
}

.section{
    padding:
        120px
        25px;

    background:#f4f1ec;
}

.inner{
    max-width:1100px;
    margin:auto;
}

.section-head{
    text-align:center;
    margin-bottom:55px;
}

.section-small{
    font-size:9px;
    letter-spacing:5px;

    color:#aaa4a9;

    margin-bottom:15px;
}

.section-title{
    font-size:30px;
    font-weight:300;

    letter-spacing:6px;

    color:#47424d;
}

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.info-card{
    min-height:185px;

    padding:32px 25px;

    text-align:center;

    background:
        rgba(255,255,255,.7);

    border:
        1px solid
        rgba(80,70,90,.09);

    border-radius:10px;

    box-shadow:
        0 20px 60px
        rgba(70,60,80,.07);

    opacity:0;

    transform:
        translateY(35px);

    transition:
        opacity .9s,
        transform .9s;
}

.info-card.show{
    opacity:1;

    transform:
        translateY(0);
}

.info-label{
    font-size:9px;
    letter-spacing:3px;

    color:#aaa5af;

    margin-bottom:25px;
}

.info-value{
    font-size:15px;
    line-height:2;

    color:#5b5662;
}

.photo-section{
    padding-top:50px;
    padding-bottom:170px;
}

.photo-window{
    width:100%;
    overflow:hidden;
}

.photo-track{
    display:flex;

    gap:20px;

    width:max-content;

    animation:
        photoLoop
        70s
        linear
        infinite;

    will-change:transform;
}

.photo-track:hover{
    animation-play-state:running;
}

.photo-card{
    width:235px;
    height:310px;

    flex:none;

    overflow:hidden;

    position:relative;

    cursor:pointer;

    background:#eeeae4;

    border-radius:4px;

    box-shadow:
        0 20px 55px
        rgba(60,52,72,.12);
}

.photo-card img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    user-select:none;

    -webkit-user-select:none;

    -webkit-user-drag:none;

    transition:
        transform .8s ease;
}

.photo-card:hover img{
    transform:
        scale(1.04);
}

@keyframes photoLoop{

    from{
        transform:
            translateX(0);
    }

    to{
        transform:
            translateX(
                calc(
                    -50% - 10px
                )
            );
    }
}

.photo-message{
    width:100%;

    padding:60px;

    text-align:center;

    color:#aaa5af;
}

.lightbox{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        rgba(25,22,32,.9);

    backdrop-filter:
        blur(15px);

    opacity:0;
    visibility:hidden;

    transition:.35s;
}

.lightbox.active{
    opacity:1;
    visibility:visible;
}

.lightbox img{
    max-width:90vw;
    max-height:88vh;

    object-fit:contain;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);

    user-select:none;

    -webkit-user-select:none;

    -webkit-user-drag:none;
}

.close-lightbox{
    position:absolute;

    right:30px;
    top:25px;

    width:42px;
    height:42px;

    border:
        1px solid
        rgba(255,255,255,.4);

    border-radius:50%;

    color:#fff;

    background:transparent;

    font-size:22px;

    cursor:pointer;
}

.footer{
    padding:
        80px
        25px
        110px;

    text-align:center;

    font-size:9px;
    letter-spacing:5px;

    color:#aaa5af;

    background:#f4f1ec;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

        height:240px;

function setDailyHero(){

    const now =
        new Date();

    const chinaDate =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Asia/Shanghai",

                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).format(now);

    const dateNumber =
        Number(
            chinaDate.replaceAll(
                "-",
                ""
            )
        );

    const index =
        dateNumber %
        heroImages.length;

    const item =
        heroImages[index];

    const hero =
        document.getElementById(
            "heroBg"
        );

    const tag =
        document.getElementById(
            "placeTag"
        );

    hero.style.backgroundImage =
        "url('" +
        item.url +
        "')";

    tag.textContent =
        item.country;
}

setDailyHero();

/* =====================================================
   月相
===================================================== */

function getMoonPhase(){

    const knownNewMoon =
        new Date(
            "2000-01-06T18:14:00Z"
        );

    const now =
        new Date();

    const days =
        (
            now -
            knownNewMoon
        ) /
        86400000;

    const cycle =
        29.530588853;

    const phase =
        (
            (
                days %
                cycle
            ) +
            cycle
        ) %
        cycle;

    if(
        phase < 1.84566
    )
        return "🌑 新月";

    if(
        phase < 5.53699
    )
        return "🌒 娥眉月";

    if(
        phase < 9.22831
    )
        return "🌓 上弦月";

    if(
        phase < 12.91963
    )
        return "🌔 盈凸月";

    if(
        phase < 16.61096
    )
        return "🌕 满月";

    if(
        phase < 20.30228
    )
        return "🌖 亏凸月";

    if(
        phase < 23.99361
    )
        return "🌗 下弦月";

    if(
        phase < 27.68493
    )
        return "🌘 残月";

    return "🌑 新月";
}

document.getElementById(
    "moonPhase"
).textContent =
    getMoonPhase();


/* =====================================================
   季节
===================================================== */

function solarLongitude(date){

    const JD =
        date.getTime()
        / 86400000
        + 2440587.5;

    const T =
        (
            JD -
            2451545.0
        ) /
        36525;

    const rad =
        Math.PI /
        180;

    let L0 =
        280.46646 +
        36000.76983 * T +
        0.0003032 * T * T;

    L0 =
        (
            (
                L0 %
                360
            ) +
            360
        ) %
        360;

    const M =
        357.52911 +
        35999.05029 * T -
        0.0001537 * T * T;

    const Mrad =
        M * rad;

    const C =
        Math.sin(Mrad) *
        (
            1.914602 -
            0.004817 * T -
            0.000014 * T * T
        )

        +

        Math.sin(
            2 * Mrad
        ) *
        (
            0.019993 -
            0.000101 * T
        )

        +

        Math.sin(
            3 * Mrad
        ) *
        0.000289;

    const trueLongitude =
        L0 + C;

    const omega =
        (
            125.04 -
            1934.136 * T
        ) *
        rad;

    const apparentLongitude =
        trueLongitude -
        0.00569 -
        0.00478 *
        Math.sin(omega);

    return (
        (
            apparentLongitude %
            360
        ) +
        360
    ) % 360;

}

function getChinaSeason(){

    const longitude =
        solarLongitude(
            new Date()
        );

    if(
        longitude >= 315 ||
        longitude < 45
    ){

        return "🌱 春天";

    }

    if(
        longitude < 135
    ){

        return "☀️ 夏天";

    }

    if(
        longitude < 225
    ){

        return "🍂 秋天";

    }

    return "❄️ 冬天";

}

function updateSeason(){

    const season =
        document.getElementById(
            "season"
        );

    if(season){

        season.textContent =
            getChinaSeason();

    }

}

updateSeason();

async function loadWeather(){

    const weatherBox =
        document.getElementById(
            "weather"
        );

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=31.2304" +

            "&longitude=121.4737" +

            "&current=" +

            "temperature_2m," +

            "relative_humidity_2m," +

            "apparent_temperature," +

            "weather_code," +

            "wind_speed_10m" +

            "&timezone=Asia%2FShanghai";

        const response =
            await fetch(url);

        if(
            !response.ok
        )
            throw new Error();

        const data =
            await response.json();

        const current =
            data.current;

        const weatherMap = {

            0:"晴天 ☀️",

            1:"基本晴朗 🌤️",

            2:"局部多云 ⛅",

            3:"阴天 ☁️",

            45:"雾 🌫️",

            48:"雾 🌫️",

            51:"小毛毛雨 🌦️",

            53:"毛毛雨 🌦️",

            55:"毛毛雨 🌦️",

            61:"小雨 🌧️",

            63:"中雨 🌧️",

            65:"大雨 🌧️",

            71:"小雪 ❄️",

            73:"中雪 ❄️",

            75:"大雪 ❄️",

            80:"阵雨 🌦️",

            81:"阵雨 🌦️",

            82:"强阵雨 🌧️",

            95:"雷雨 ⛈️",

            96:"雷雨 ⛈️",

            99:"强雷雨 ⛈️"

        };

        const description =
            weatherMap[
                current.weather_code
            ] ||
            "天气变化中";

        weatherBox.innerHTML =

            description +

            "<br>" +

            Math.round(
                current.temperature_2m
            ) +

            "°C · 体感 " +

            Math.round(
                current.apparent_temperature
            ) +

            "°C" +

            "<br>" +

            "湿度 " +

            Math.round(
                current.relative_humidity_2m
            ) +

            "% · 风速 " +

            Math.round(
                current.wind_speed_10m
            ) +

            " km/h";

    }catch(error){

        weatherBox.textContent =
            "天气暂时无法读取，请稍后刷新";

    }

}

loadWeather();

setInterval(
    loadWeather,
    600000
);


/* =====================================================
   我的照片
===================================================== */

async function loadPhotos(){

    const track =
        document.getElementById(
            "photoTrack"
        );

    try{

        const response =
            await fetch(
                "photos.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(
            !response.ok
        )
            throw new Error();

        const photos =
            await response.json();

        if(
            !Array.isArray(
                photos
            ) ||
            photos.length === 0
        ){

            track.innerHTML =
                '<div class="photo-message">' +
                'photos 文件夹里暂时没有照片' +
                '</div>';

            return;

        }

        const allPhotos =
            photos.concat(
                photos
            );

        track.innerHTML = "";

        allPhotos.forEach(
            function(path){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "photo-card";

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    path +
                    "?v=" +
                    Date.now();

                img.alt =
                    "Memory";

                img.loading =
                    "lazy";

                img.draggable =
                    false;

                card.addEventListener(
                    "click",
                    function(){

                        document.getElementById(
                            "lightboxImg"
                        ).src =
                            img.src;

                        document.getElementById(
                            "lightbox"
                        ).classList.add(
                            "active"
                        );

                    }
                );

                card.appendChild(
                    img
                );

                track.appendChild(
                    card
                );

            }
        );

    }catch(error){

        track.innerHTML =
            '<div class="photo-message">' +
            '照片暂时无法读取，请稍后刷新' +
            '</div>';

    }

}

loadPhotos();

setInterval(
    loadPhotos,
    300000
);

/* =====================================================
   卡片动画
===================================================== */

const cards =
    document.querySelectorAll(
        ".info-card"
    );

const observer =
    new IntersectionObserver(
        function(entries){

            entries.forEach(
                function(entry){

                    if(
                        entry.isIntersecting
                    ){

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold:.18
        }
    );

cards.forEach(
    function(card){

        observer.observe(
            card
        );

    }
);
