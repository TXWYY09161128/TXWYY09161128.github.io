<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星 · A Quiet Place</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family: Georgia, "Times New Roman", serif;
  color:#3e4738;
  background:#f5f0e5;
}

/* ===== 首页 ===== */

.hero{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      rgba(246,235,207,.25) 0%,
      rgba(249,239,211,.05) 32%,
      rgba(210,190,137,.08) 55%,
      rgba(93,111,64,.08) 100%
    ),
    linear-gradient(
      to bottom,
      #dce8df 0%,
      #edf0d9 38%,
      #cbd29d 58%,
      #82935b 76%,
      #687b4c 100%
    );
}

/* 柔和秋日阳光 */

.sunlight{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(
      ellipse at 72% 25%,
      rgba(255,244,197,.75) 0%,
      rgba(255,232,168,.28) 22%,
      transparent 48%
    );
  pointer-events:none;
}

/* 远处天空 */

.horizon{
  position:absolute;
  left:0;
  right:0;
  top:42%;
  height:18%;
  background:
    linear-gradient(
      to bottom,
      rgba(105,120,74,.18),
      rgba(104,119,69,.48)
    );
  filter:blur(2px);
}

/* 乡村房子 */

.house{
  position:absolute;
  left:50%;
  top:37%;
  transform:translateX(-50%);
  width:330px;
  height:185px;
  background:#eee7d6;
  box-shadow:0 18px 35px rgba(47,55,36,.15);
}

.house::before{
  content:"";
  position:absolute;
  left:-30px;
  top:-82px;
  width:390px;
  height:120px;
  background:#6f604c;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.house::after{
  content:"";
  position:absolute;
  left:142px;
  top:50px;
  width:47px;
  height:135px;
  background:#8b7259;
}

.window{
  position:absolute;
  width:52px;
  height:64px;
  top:65px;
  background:
    linear-gradient(90deg,
      transparent 47%,
      #eee7d6 48%,
      #eee7d6 52%,
      transparent 53%
    ),
    linear-gradient(
      #9aa9a0,
      #d8ded4
    );
  border:5px solid #eee7d6;
}

.window.one{left:48px;}
.window.two{right:48px;}

/* 巨大的天然草坪 */

.lawn{
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-4%;
  height:55%;
  border-radius:50% 50% 0 0 / 15% 15% 0 0;

  background:
    radial-gradient(
      ellipse at 50% 15%,
      rgba(216,205,143,.38),
      transparent 38%
    ),
    linear-gradient(
      to bottom,
      #87965e 0%,
      #748852 38%,
      #607747 100%
    );

  box-shadow:
    inset 0 25px 55px rgba(245,228,165,.14);
}

/* 草地上的自然落叶 */

.leaf{
  position:absolute;
  width:12px;
  height:7px;
  border-radius:80% 15% 80% 15%;
  transform:rotate(35deg);
  opacity:.85;
}

.leaf:nth-child(1){left:7%;bottom:18%;background:#c97935;transform:rotate(22deg);}
.leaf:nth-child(2){left:16%;bottom:31%;background:#d79b3f;transform:rotate(70deg);}
.leaf:nth-child(3){left:25%;bottom:13%;background:#b75b2d;transform:rotate(12deg);}
.leaf:nth-child(4){left:34%;bottom:25%;background:#d08b32;transform:rotate(82deg);}
.leaf:nth-child(5){left:44%;bottom:11%;background:#bd6330;transform:rotate(35deg);}
.leaf:nth-child(6){left:54%;bottom:29%;background:#d99b42;transform:rotate(18deg);}
.leaf:nth-child(7){left:63%;bottom:16%;background:#b75b2d;transform:rotate(64deg);}
.leaf:nth-child(8){left:73%;bottom:27%;background:#d18b38;transform:rotate(28deg);}
.leaf:nth-child(9){left:83%;bottom:13%;background:#c46b30;transform:rotate(74deg);}
.leaf:nth-child(10){left:92%;bottom:34%;background:#d6a34d;transform:rotate(20deg);}

/* 秋树 */

.tree{
  position:absolute;
  bottom:39%;
}

.tree.left{
  left:5%;
}

.tree.right{
  right:7%;
}

.trunk{
  position:absolute;
  left:50%;
  bottom:0;
  width:18px;
  height:180px;
  transform:translateX(-50%);
  background:#66513d;
  border-radius:50%;
}

.crown{
  position:relative;
  width:230px;
  height:190px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 35%,#e1a044 0 18%,transparent 19%),
    radial-gradient(circle at 68% 27%,#bd6030 0 20%,transparent 21%),
    radial-gradient(circle at 48% 62%,#d88735 0 28%,transparent 29%),
    radial-gradient(circle at 75% 60%,#cf7830 0 20%,transparent 21%),
    #b96532;
  filter:drop-shadow(0 14px 18px rgba(55,55,28,.12));
}

/* 漂浮树叶 */

.falling{
  position:absolute;
  width:13px;
  height:8px;
  border-radius:80% 20% 80% 20%;
  background:#d17a32;
  animation:fall 10s linear infinite;
}

.f1{left:18%;top:18%;animation-delay:1s;}
.f2{left:35%;top:7%;animation-delay:4s;background:#d99b3f;}
.f3{left:68%;top:22%;animation-delay:2s;background:#b85c30;}
.f4{left:83%;top:12%;animation-delay:6s;background:#ce8735;}

@keyframes fall{
  0%{
    transform:translate(0,0) rotate(0);
    opacity:0;
  }
  15%{opacity:.9;}
  50%{
    transform:translate(70px,260px) rotate(180deg);
  }
  100%{
    transform:translate(-20px,560px) rotate(360deg);
    opacity:0;
  }
}

/* 首页文字 */

.content{
  position:absolute;
  z-index:10;
  left:9%;
  top:17%;
  max-width:520px;
}

.content .small{
  font-size:13px;
  letter-spacing:4px;
  color:#697157;
  margin-bottom:24px;
}

.content h1{
  font-size:clamp(58px,9vw,105px);
  font-weight:400;
  letter-spacing:2px;
  color:#394635;
  line-height:.95;
}

.content h2{
  margin-top:20px;
  font-size:18px;
  font-weight:400;
  letter-spacing:5px;
  color:#68705b;
}

.content p{
  margin-top:30px;
  max-width:390px;
  font-size:16px;
  line-height:2;
  color:#4e5947;
}

.enter{
  display:inline-block;
  margin-top:34px;
  padding:13px 25px;
  border:1px solid rgba(70,78,56,.45);
  border-radius:30px;
  text-decoration:none;
  color:#46513e;
  font-size:13px;
  letter-spacing:2px;
  transition:.3s;
}

.enter:hover{
  background:rgba(255,248,225,.45);
  transform:translateY(-2px);
}

/* ===== 第二页 ===== */

.memory{
  min-height:100vh;
  padding:120px 9%;
  background:#f5f0e5;
}

.memory-inner{
  max-width:850px;
  margin:auto;
}

.date{
  font-size:12px;
  letter-spacing:4px;
  color:#9b8869;
}

.memory h3{
  margin-top:25px;
  font-size:42px;
  font-weight:400;
  color:#48523f;
}

.quote{
  margin-top:35px;
  font-size:20px;
  line-height:2;
  color:#626957;
}

footer{
  margin-top:100px;
  padding-top:25px;
  border-top:1px solid #d8d0bd;
  font-size:11px;
  letter-spacing:3px;
  color:#9a927f;
}

/* 手机 */

@media(max-width:700px){

  .content{
    left:8%;
    right:8%;
    top:13%;
  }

  .content h1{
    font-size:65px;
  }

  .content p{
    font-size:15px;
  }

  .house{
    width:230px;
    height:130px;
    top:43%;
  }

  .house::before{
    left:-20px;
    width:270px;
    height:80px;
    top:-55px;
  }

  .window{
    width:35px;
    height:45px;
    top:43px;
  }

  .window.one{left:30px;}
  .window.two{right:30px;}

  .house::after{
    left:98px;
    top:38px;
    width:35px;
    height:92px;
  }

  .tree.left{
    left:-20%;
  }

  .tree.right{
    right:-20%;
  }

  .crown{
    transform:scale(.7);
  }

  .memory{
    padding:90px 8%;
  }

  .memory h3{
    font-size:34px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="sunlight"></div>
  <div class="horizon"></div>

  <div class="tree left">
    <div class="crown"></div>
    <div class="trunk"></div>
  </div>

  <div class="tree right">
    <div class="crown"></div>
    <div class="trunk"></div>
  </div>

  <div class="house">
    <div class="window one"></div>
    <div class="window two"></div>
  </div>

  <div class="lawn">
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
    <span class="leaf"></span>
  </div>

  <span class="falling f1"></span>
  <span class="falling f2"></span>
  <span class="falling f3"></span>
  <span class="falling f4"></span>

  <div class="content">
    <div class="small">A QUIET PLACE</div>

    <h1>圆落星</h1>

    <h2>A PLACE FOR MEMORY</h2>

    <p>
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </p>

    <a href="#memory" class="enter">ENTER MY WORLD →</a>
  </div>

</section>

<section class="memory" id="memory">

  <div class="memory-inner">

    <div class="date">TODAY</div>

    <h3>留一点时间给自己。</h3>

    <div class="quote">
      “有些美好，不需要发生什么，
      只是风吹过草地，阳光落下来，
      就已经值得记住。”
    </div>

    <footer>
      A QUIET PLACE · 2026
    </footer>

  </div>

</section>

</body>
</html>
