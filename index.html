<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星 · 星空主页</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Microsoft YaHei",sans-serif;
min-height:100vh;
color:white;
overflow-x:hidden;
background:
radial-gradient(circle at 20% 20%,#5b21b6 0%,transparent 30%),
radial-gradient(circle at 80% 10%,#2563eb 0%,transparent 25%),
linear-gradient(#020617,#0f172a);
}


/* 星空 */

body:before{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(white 1px,transparent 1px);
background-size:45px 45px;
opacity:.35;
animation:stars 20s linear infinite;
z-index:-2;
}


@keyframes stars{
from{
transform:translateY(0);
}
to{
transform:translateY(80px);
}
}


/* 星云光 */

body:after{
content:"";
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:#a855f7;
filter:blur(120px);
opacity:.25;
top:20%;
left:20%;
z-index:-1;
animation:nebula 8s infinite alternate;
}


@keyframes nebula{
from{
transform:translate(0,0);
}
to{
transform:translate(100px,-50px);
}
}


.container{
max-width:900px;
margin:auto;
padding:30px;
}


nav{
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
font-size:24px;
font-weight:bold;
}


.nav-btn{
color:white;
text-decoration:none;
border:1px solid rgba(255,255,255,.3);
padding:10px 20px;
border-radius:30px;
}


.hero{

height:75vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;

}


.hero h1{

font-size:65px;

background:linear-gradient(
90deg,
#fff,
#c084fc,
#38bdf8
);

-webkit-background-clip:text;
color:transparent;

animation:light 2s infinite alternate;

}


@keyframes light{

from{
filter:drop-shadow(0 0 10px #a855f7);
}

to{
filter:drop-shadow(0 0 35px #38bdf8);
}

}


.hero p{

margin-top:25px;
font-size:20px;
line-height:2;
color:#ddd;

}


.button{

margin-top:35px;
padding:15px 35px;
border-radius:40px;
background:white;
color:#111;
text-decoration:none;
font-weight:bold;

}
.card{

margin-top:35px;
padding:35px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

border-radius:30px;

backdrop-filter:blur(15px);

box-shadow:0 0 40px rgba(0,0,0,.3);

}


.card h2{

margin-bottom:15px;

font-size:28px;

}


.card p{

color:#ddd;

line-height:2;

font-size:17px;

}


/* 月亮 */

.moon{

position:fixed;

right:80px;

top:100px;

width:100px;

height:100px;

background:#fff;

border-radius:50%;

box-shadow:

0 0 30px white,

0 0 80px #93c5fd;

}


footer{

text-align:center;

padding:50px 0;

color:#aaa;

}


/* 手机适配 */

@media(max-width:600px){

.hero h1{

font-size:42px;

}

.moon{

width:60px;

height:60px;

right:30px;

top:80px;

}

}

</style>

</head>


<body>


<div class="moon"></div>


<div class="container">


<nav>

<div class="logo">
🌙 圆落星
</div>


<a class="nav-btn" href="#about">
关于我
</a>

</nav>



<section class="hero">


<h1>
圆落星
</h1>


<p>

追逐星光 · 热爱生活<br>

欢迎来到我的星空个人主页

</p>


<a class="button" href="#about">

探索宇宙

</a>


</section>




<section class="card" id="about">


<h2>
✨ 关于我
</h2>


<p>

我是圆落星，一个喜欢探索和创造的人。<br>

这里记录我的作品、想法和成长旅程。

</p>


</section>




<section class="card">


<h2>
🚀 我的作品
</h2>


<p>

摄影 · 设计 · AI创作 · 个人项目

<br>

未来会在这里展示更多内容。

</p>


</section>




<section class="card">


<h2>
⭐ 我的兴趣
</h2>


<p>

🌌 星空<br>

🎨 创意设计<br>

💻 科技探索<br>

📷 记录美好

</p>


</section>




<section class="card">


<h2>
📩 联系我
</h2>


<p>

邮箱：你的邮箱<br>

社交账号：你的账号

</p>


</section>




<footer>

© 2026 圆落星 · 星空主页

</footer>



</div>


</body>

</html>
