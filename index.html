<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人网站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0b10;
  color:white;
  min-height:100vh;
}
.container{
  max-width:900px;
  margin:auto;
  padding:25px;
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
}
.logo{
  font-size:22px;
  font-weight:700;
}
.nav-btn{
  padding:10px 18px;
  border:1px solid #444;
  border-radius:20px;
  color:#fff;
  text-decoration:none;
}
.hero{
  min-height:75vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  align-items:center;
}
.hero h1{
  font-size:52px;
  margin-bottom:20px;
  background:linear-gradient(90deg,#fff,#8b8bff);
  -webkit-background-clip:text;
  color:transparent;
}
.hero p{
  color:#aaa;
  font-size:18px;
  line-height:1.8;
  max-width:600px;
}
.button{
  margin-top:30px;
  display:inline-block;
  padding:14px 28px;
  border-radius:30px;
  background:white;
  color:#111;
  text-decoration:none;
  font-weight:600;
}
.card{
  margin-top:30px;
  padding:30px;
  background:#15151d;
  border:1px solid #292936;
  border-radius:24px;
}
.card h2{
  margin-bottom:12px;
}
.card p{
  color:#aaa;
  line-height:1.8;
}
footer{
  text-align:center;
  padding:40px 0;
  color:#666;
}
@media(max-width:600px){
  .hero h1{font-size:40px}
  .hero p{font-size:16px}
}
</style>
</head>

<body>

<div class="container">

<nav>
  <div class="logo">我的网站</div>
  <a class="nav-btn" href="#about">关于我</a>
</nav>

<section class="hero">
  <h1>你好，我是一个独特的人</h1>
  <p>
    欢迎来到我的个人网站。<br>
    这里可以放我的照片、个人介绍、作品、联系方式以及我想分享的一切。
  </p>
  <a class="button" href="#about">了解更多</a>
</section>

<section class="card" id="about">
  <h2>关于我</h2>
  <p>
    这是我的个人空间。以后可以在这里添加我的个人介绍、
    兴趣爱好、作品、社交账号和联系方式。
  </p>
</section>

<section class="card">
  <h2>我的作品</h2>
  <p>
    这里可以放照片、设计、视频、项目或者其他作品。
  </p>
</section>

<footer>
  © 2026 我的个人网站
</footer>

</div>

</body>
</html>
