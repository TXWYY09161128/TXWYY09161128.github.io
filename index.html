<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:#3f4939;
  background:#f4efe3;
}

/* =====================
   首页
===================== */

.hero{
  height:100vh;
  min-height:680px;
  position:relative;
  overflow:hidden;

  /* 明亮的秋天天空 */
  background:
    linear-gradient(
      180deg,
      #dce9e5 0%,
      #edf0d9 38%,
      #d8d69f 55%,
      #9ba568 72%,
      #718653 100%
    );
}

/* 秋日阳光 */
.sun{
  position:absolute;
  width:650px;
  height:650px;
  right:-100px;
  top:-250px;

  background:radial-gradient(
    circle,
    rgba(255,246,205,.85) 0%,
    rgba(255,237,177,.38) 28%,
    transparent 68%
  );
}

/* 远处地平线 */
.horizon{
  position:absolute;
  left:0;
  right:0;
  top:48%;
  height:14%;

  background:
    linear-gradient(
      180deg,
      rgba(95,112,65,.08),
      rgba(77,96,57,.35)
    );

  filter:blur(2px);
}

/* =====================
   房子
   普通欧美家庭住宅
===================== */

.house{
  position:absolute;
  z-index:4;

  left:55%;
  top:39%;

  width:300px;
  height:165px;

  background:#eee5d1;

  box-shadow:
    0 20px 35px rgba(55,65,40,.15);
}

/* 屋顶 */
.roof{
  position:absolute;

  left:-28px;
  top:-73px;

  width:356px;
  height:105px;

  background:#71614e;

  clip-path:polygon(
    50% 0,
    100% 100%,
    0 100%
  );
}

/* 门 */
.door{
  position:absolute;
  left:132px;
  bottom:0;

  width:43px;
  height:105px;

  background:#806b55;
}

/* 窗户 */
.window{
  position:absolute;

  top:55px;

  width:52px;
  height:58px;

  border:5px solid #eee5d1;

  background:
    linear-gradient(
      90deg,
      transparent 47%,
      #eee5d1 48%,
      #eee5d1 52%,
      transparent 53%
    ),
    linear-gradient(
      #9eaaa1,
      #dce2d8
    );
}

.window.left{
  left:42px;
}

.window.right{
  right:42px;
}

/* =====================
   超大草坪
===================== */

.lawn{
  position:absolute;
  z-index:3;

  left:-10%;
  right:-10%;
  bottom:-16%;

  height:59%;

  border-radius:50% 50% 0 0 / 13% 13% 0 0;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(224,211,153,.32),
      transparent 45%
    ),
    linear-gradient(
      180deg,
      #8d9d60 0%,
      #7d9156 35%,
      #6c844e 70%,
      #617947 100%
    );
}

/* 草坪明暗层次 */
.lawn::before{
  content:"";

  position:absolute;
  left:0;
  right:0;
  top:18%;

  height:45%;

  background:
    linear-gradient(
      175deg,
      transparent 0 35%,
      rgba(255,238,180,.07) 36% 38%,
      transparent 39% 100%
    );
}

/* =====================
   左右大树
===================== */

.tree{
  position:absolute;
  z-index:5;
  bottom:43%;
}

.tree-left{
  left:4%;
}

.tree-right{
  right:5%;
}

/* 树干 */
.trunk{
  position:absolute;

  left:50%;
  bottom:-2px;

  width:18px;
  height:190px;

  transform:translateX(-50%);

  background:#68533d;

  border-radius:50%;
}

/* 树冠 */
.crown{
  position:relative;

  width:210px;
  height:180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 25% 38%,
      #d99b3d 0 17%,
      transparent 18%
    ),
    radial-gradient(
      circle at 68% 25%,
      #c56731 0 21%,
      transparent 22%
    ),
    radial-gradient(
      circle at 48% 67%,
      #d47d31 0 27%,
      transparent 28%
    ),
    radial-gradient(
      circle at 78% 65%,
      #e0a044 0 18%,
      transparent 19%
    ),
    #bd6832;

  filter:
    drop-shadow(
      0 15px 17px rgba(55,60,35,.12)
    );
}

/* =====================
   草地落叶
===================== */

.leaves{
  position:absolute;
  z-index:7;
  inset:0;
  pointer-events:none;
}

.leaf{
  position:absolute;

  width:13px;
  height:8px;

  border-radius:80% 20% 80% 20%;

  opacity:.88;
}

/* 散落在巨大草坪上的叶子 */

.l1{left:5%;bottom:16%;background:#c86c30;transform:rotate(25deg);}
.l2{left:12%;bottom:29%;background:#dfa043;transform:rotate(70deg);}
.l3{left:19%;bottom:11%;background:#b85a2d;transform:rotate(12deg);}
.l4{left:27%;bottom:23%;background:#d38332;transform:rotate(55deg);}
.l5{left:36%;bottom:15%;background:#dca044;transform:rotate(88deg);}
.l6{left:43%;bottom:32%;background:#c4632d;transform:rotate(35deg);}
.l7{left:51%;bottom:12%;background:#d58a35;transform:rotate(18deg);}
.l8{left:59%;bottom:25%;background:#bc5b2c;transform:rotate(75deg);}
.l9{left:67%;bottom:16%;background:#dda044;transform:rotate(42deg);}
.l10{left:75%;bottom:30%;background:#c66b30;transform:rotate(17deg);}
.l11{left:84%;bottom:14%;background:#d58b36;transform:rotate(68deg);}
.l12{left:93%;bottom:27%;background:#bc5d2d;transform:rotate(30deg);}

/* =====================
   飘落的叶子
===================== */

.flying{
  position:absolute;
  z-index:10;

  width:13px;
  height:8px;

  border-radius:80% 20% 80% 20%;

  background:#d17c32;

  animation:
    floatDown 9s linear infinite;
}

.flying.a{
  left:25%;
  top:8%;
  animation-delay:1s;
}

.flying.b{
  left:46%;
  top:4%;
  background:#dfa044;
  animation-delay:4s;
}

.flying.c{
  left:72%;
  top:14%;
  background:#bd5c2c;
  animation-delay:2s;
}

@keyframes floatDown{

  0%{
    transform:
      translate(0,0)
      rotate(0deg);

    opacity:0;
  }

  15%{
    opacity:.9;
  }

  50%{
    transform:
      translate(75px,280px)
      rotate(180deg);
  }

  100%{
    transform:
      translate(-25px,620px)
      rotate(360deg);

    opacity:0;
  }
}

/* =====================
   文字
===================== */

.content{
  position:absolute;
  z-index:20;

  left:9%;
  top:17%;

  max-width:500px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:5px;

  color:#687157;

  margin-bottom:24px;
}

h1{
  font-size:
    clamp(64px,9vw,105px);

  font-weight:400;

  line-height:.95;

  color:#394634;
}

.subtitle{
  margin-top:20px;

  font-size:17px;

  letter-spacing:5px;

  color:#68705b;
}

.description{
  margin-top:30px;

  max-width:390px;

  font-size:16px;

  line-height:2;

  color:#4e5947;
}

.enter{
  display:inline-block;

  margin-top:32px;

  padding:13px 25px;

  border:
    1px solid
    rgba(65,76,52,.42);

  border-radius:30px;

  text-decoration:none;

  color:#46513e;

  font-size:12px;

  letter-spacing:2px;

  transition:.3s;
}

.enter:hover{
  background:
    rgba(255,248,225,.45);

  transform:
    translateY(-2px);
}

/* =====================
   第二部分
===================== */

.memory{
  min-height:100vh;

  padding:
    120px 9%;

  background:#f4efe3;
}

.memory-inner{
  max-width:820px;
  margin:auto;
}

.date{
  font-size:11px;

  letter-spacing:4px;

  color:#9a8869;
}

.memory h2{
  margin-top:25px;

  font-size:42px;

  font-weight:400;

  color:#48523f;
}

.quote{
  margin-top:35px;

  max-width:650px;

  font-size:20px;

  line-height:2;

  color:#626957;
}

footer{
  margin-top:100px;

  padding-top:25px;

  border-top:
    1px solid #d8d0bd;

  font-size:10px;

  letter-spacing:3px;

  color:#9a927f;
}

/* =====================
   手机
===================== */

@media(max-width:700px){

  .content{
    left:8%;
    right:8%;
    top:13%;
  }

  h1{
    font-size:66px;
  }

  .description{
    font-size:15px;
  }

  .house{
    left:56%;
    top:45%;

    width:225px;
    height:125px;
  }

  .roof{
    left:-20px;
    width:265px;
    height:78px;
    top:-55px;
  }

  .door{
    left:98px;
    width:34px;
    height:82px;
  }

  .window{
    width:37px;
    height:44px;
    top:40px;
  }

  .window.left{
    left:27px;
  }

  .window.right{
    right:27px;
  }

  .tree-left{
    left:-22%;
  }

  .tree-right{
    right:-22%;
  }

  .crown{
    transform:scale(.68);
  }

  .memory{
    padding:
      90px 8%;
  }

  .memory h2{
    font-size:34px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="sun"></div>
  <div class="horizon"></div>

  <!-- 左边大树 -->
  <div class="tree tree-left">
    <div class="crown"></div>
    <div class="trunk"></div>
  </div>

  <!-- 右边大树 -->
  <div class="tree tree-right">
    <div class="crown"></div>
    <div class="trunk"></div>
  </div>

  <!-- 房子 -->
  <div class="house">

    <div class="roof"></div>

    <div class="window left"></div>
    <div class="window right"></div>

    <div class="door"></div>

  </div>

  <!-- 巨大草坪 -->
  <div class="lawn"></div>

  <!-- 草坪上的自然落叶 -->
  <div class="leaves">

    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>
    <span class="leaf l5"></span>
    <span class="leaf l6"></span>
    <span class="leaf l7"></span>
    <span class="leaf l8"></span>
    <span class="leaf l9"></span>
    <span class="leaf l10"></span>
    <span class="leaf l11"></span>
    <span class="leaf l12"></span>

  </div>

  <!-- 飘落的叶子 -->
  <span class="flying a"></span>
  <span class="flying b"></span>
  <span class="flying c"></span>

  <!-- 网站文字 -->
  <div class="content">

    <div class="eyebrow">
      A QUIET PLACE
    </div>

    <h1>圆落星</h1>

    <div class="subtitle">
      A PLACE FOR MEMORY
    </div>

    <div class="description">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </div>

    <a href="#memory" class="enter">
      ENTER MY WORLD →
    </a>

  </div>

</section>


<section class="memory" id="memory">

  <div class="memory-inner">

    <div class="date">
      TODAY
    </div>

    <h2>
      留一点时间给自己。
    </h2>

    <div class="quote">
      “有些美好，不需要发生什么，
      只是风吹过草地，阳光落下来，
      就已经值得记住。”
    </div>

    <footer>
      A QUIET PLACE · 2026
    </footer>

  </div>

</section>

</body>
</html>
