/*
   每小时换一次。

   不是简单的：
   1 → 2 → 3 → 4……

   前面的图片按顺序出现，
   超过图片池以后会根据小时数
   自动重新抽取。

   会避开连续重复，
   所以允许偶尔看到以前的照片，
   但不会每小时都回到同一张。
*/

function getHourNumber(){

    const now =
        new Date();

    const chinaHour =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:"Asia/Shanghai",
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                hour12:false
            }
        ).formatToParts(now);

    let year = "";
    let month = "";
    let day = "";
    let hour = "";

    chinaHour.forEach(
        function(part){

            if(part.type === "year")
                year = part.value;

            if(part.type === "month")
                month = part.value;

            if(part.type === "day")
                day = part.value;

            if(part.type === "hour")
                hour = part.value;

        }
    );

    return (
        Number(year) * 8760 +
        Number(month) * 744 +
        Number(day) * 24 +
        Number(hour)
    );

}


function setHourlyHero(){

    const hourNumber =
        getHourNumber();

    const hero =
        document.getElementById(
            "heroBg"
        );

    const tag =
        document.getElementById(
            "placeTag"
        );

    /*
       使用小时数产生一个稳定的数字。
       同一个小时刷新网页，
       不会突然换图。
    */

    let index;

    if(
        hourNumber <
        heroImages.length
    ){

        index =
            hourNumber;

    }else{

        /*
           后面继续变化，
           允许重新出现以前的图片。
        */

        const seed =
            Math.abs(
                Math.sin(
                    hourNumber * 12.9898
                ) *
                43758.5453
            );

        index =
            Math.floor(
                seed *
                heroImages.length
            ) %
            heroImages.length;

    }

    const item =
        heroImages[index];

    hero.style.opacity = "0";

    setTimeout(
        function(){

            hero.style.backgroundImage =
                "url('" +
                item.url +
                "')";

            tag.textContent =
                item.country;

            hero.style.opacity = "1";

        },
        300
    );

}

/* =========================
   月相
   ========================= */

function getMoonPhase(){

    const knownNewMoon =
        new Date(
            "2000-01-06T18:14:00Z"
        );

    const now =
        new Date();

    const days =
        (
            now -
            knownNewMoon
        ) /
        86400000;

    const cycle =
        29.530588853;

    const phase =
        (
            (
                days %
                cycle
            ) +
            cycle
        ) %
        cycle;

    if(
        phase < 1.84566
    )
        return "🌑 新月";

    if(
        phase < 5.53699
    )
        return "🌒 娥眉月";

    if(
        phase < 9.22831
    )
        return "🌓 上弦月";

    if(
        phase < 12.91963
    )
        return "🌔 盈凸月";

    if(
        phase < 16.61096
    )
        return "🌕 满月";

    if(
        phase < 20.30228
    )
        return "🌖 亏凸月";

    if(
        phase < 23.99361
    )
        return "🌗 下弦月";

    if(
        phase < 27.68493
    )
        return "🌘 残月";

    return "🌑 新月";
}

document.getElementById(

).textContent =

/* =========================

function solarLongitude(date){

    const JD =
        date.getTime()
        / 86400000
        + 2440587.5;

    const T =
        (
            JD -
            2451545.0
        ) /
        36525;

    const rad =
        Math.PI /
        180;

    let L0 =
        280.46646 +
        36000.76983 * T +
        0.0003032 * T * T;

    L0 =
        (
            (
                L0 %
                360
            ) +
            360
        ) %
        360;

    const M =
        357.52911 +
        35999.05029 * T -
        0.0001537 * T * T;

    const Mrad =
        M * rad;

    const C =
        Math.sin(Mrad) *
        (
            1.914602 -
            0.004817 * T -
            0.000014 * T * T
        )

        +

        Math.sin(
            2 * Mrad
        ) *
        (
            0.019993 -
            0.000101 * T
        )

        +

        Math.sin(
            3 * Mrad
        ) *
        0.000289;

    const trueLongitude =
        L0 + C;

    const omega =
        (
            125.04 -
            1934.136 * T
        ) *
        rad;

    const apparentLongitude =
        trueLongitude -
        0.00569 -
        0.00478 *
        Math.sin(omega);

    return (
        (
            apparentLongitude %
            360
        ) +
        360
    ) % 360;

}

function getChinaSeason(){

    const longitude =
        solarLongitude(
            new Date()
        );

    if(
        longitude >= 315 ||
        longitude < 45
    ){

        return "🌱 春天";

    }

    if(
        longitude < 135
    ){

        return "☀️ 夏天";

    }

    if(
        longitude < 225
    ){

        return "🍂 秋天";

    }

    return "❄️ 冬天";

}

function updateSeason(){

    const season =

    if(season){

            51:"小毛毛雨 🌦️",

            53:"毛毛雨 🌦️",

            55:"毛毛雨 🌦️",

            61:"小雨 🌧️",

            63:"中雨 🌧️",

            65:"大雨 🌧️",

            71:"小雪 ❄️",

            73:"中雪 ❄️",

            75:"大雪 ❄️",

            95:"雷雨 ⛈️",

            96:"雷雨 ⛈️",

            99:"强雷雨 ⛈️"

        };

    }

}

loadWeather();

setInterval(

    600000
);


/* =========================
   我的照片
   ========================= */

async function loadPhotos(){

    const track =
        document.getElementById(
            "photoTrack"
        );

    try{

        const response =
            await fetch(
                "photos.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(
            !response.ok
        )
            throw new Error();

        const photos =
            await response.json();

        if(
            !Array.isArray(
                photos
            ) ||
            photos.length === 0
        ){

            track.innerHTML =
                '<div class="photo-message">' +
                'photos 文件夹里暂时没有照片' +
                '</div>';

            return;

        }

        const allPhotos =
            photos.concat(
                photos
            );

        track.innerHTML = "";

        allPhotos.forEach(
            function(path){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "photo-card";

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    path +
                    "?v=" +
                    Date.now();

                img.alt =
                    "Memory";

                img.loading =
                    "lazy";

                img.draggable =
                    false;

                card.addEventListener(
                    "click",
                    function(){

                        document.getElementById(
                            "lightboxImg"
                        ).src =
                            img.src;

                        document.getElementById(
                            "lightbox"
                        ).classList.add(
                            "active"
                        );

                    }
                );

                card.appendChild(
                    img
                );

                track.appendChild(
                    card
                );

            }
        );

    }catch(error){

        track.innerHTML =
            '<div class="photo-message">' +
            '照片暂时无法读取，请稍后刷新' +
            '</div>';

    }

}

loadPhotos();

setInterval(
    loadPhotos,
    300000
);


/* =========================
   图片关闭
   ========================= */

document.getElementById(
    "closeLightbox"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "lightbox"
        ).classList.remove(
            "active"
        );

    }
);

document.getElementById(
    "lightbox"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            this.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   禁止照片普通右键 / 拖拽
   ========================= */

document.addEventListener(
    "contextmenu",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);

document.addEventListener(
    "dragstart",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);


/* =========================
   滚动出现动画
   ========================= */

const cards =
    document.querySelectorAll(
        ".info-card"
    );

const observer =
    new IntersectionObserver(
        function(entries){

            entries.forEach(
                function(entry){

                    if(
                        entry.isIntersecting
                    ){

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold:.18
        }
    );

cards.forEach(
    function(card){

        observer.observe(
            card
        );

    }
);

</script>
