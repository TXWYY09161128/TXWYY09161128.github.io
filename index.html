<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>圆落星</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:Georgia,"Times New Roman","PingFang SC",serif;
  color:#fff;
  background:#7d674f;
  overflow-x:hidden;
}

/* =========================
   整个自然庭院
========================= */

.hero{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      rgba(168,186,177,.15) 0%,
      rgba(214,194,156,.05) 38%,
      rgba(76,68,48,.20) 100%
    ),
    linear-gradient(
      to bottom,
      #aebdb2 0%,
      #c9b991 43%,
      #78905c 44%,
      #64774c 100%
    );
}

/* 天空 */
.sky{
  position:absolute;
  inset:0 0 48% 0;

  background:
    radial-gradient(
      ellipse at 68% 32%,
      rgba(255,224,166,.65),
      transparent 28%
    ),
    linear-gradient(
      #aebeb9,
      #d8c9a9
    );

  z-index:0;
}

/* 远处树林 */
.tree-line{
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:43%;
  height:24%;

  background:
    radial-gradient(ellipse at 10% 70%,#76563e 0 9%,transparent 10%),
    radial-gradient(ellipse at 23% 65%,#8d633f 0 11%,transparent 12%),
    radial-gradient(ellipse at 39% 72%,#6d513c 0 10%,transparent 11%),
    radial-gradient(ellipse at 55% 66%,#8a5c3c 0 12%,transparent 13%),
    radial-gradient(ellipse at 71% 70%,#725039 0 10%,transparent 11%),
    radial-gradient(ellipse at 88% 64%,#956743 0 12%,transparent 13%);

  opacity:.9;
  filter:blur(1px);
  z-index:1;
}

/* 大房子 */
.house{
  position:absolute;
  z-index:2;

  width:260px;
  height:125px;

  left:50%;
  bottom:48%;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #d8cbb5,
      #eee5d3
    );

  box-shadow:
    0 18px 25px rgba(49,39,28,.18);
}

/* 房顶 */
.house:before{
  content:"";
  position:absolute;

  left:-25px;
  top:-60px;

  border-left:155px solid transparent;
  border-right:155px solid transparent;
  border-bottom:75px solid #6b5545;
}

/* 房子窗户 */
.house:after{
  content:"";
  position:absolute;

  width:46px;
  height:46px;

  left:32px;
  top:35px;

  background:
    linear-gradient(
      90deg,
      transparent 47%,
      #65594c 48% 52%,
      transparent 53%
    ),
    linear-gradient(
      transparent 47%,
      #65594c 48% 52%,
      transparent 53%
    ),
    #a7b6b1;

  border:5px solid #e9dfcd;
}

/* 大草地 */
.lawn{
  position:absolute;
  z-index:3;

  left:-5%;
  right:-5%;
  bottom:-5%;

  height:58%;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(203,179,119,.42),
      transparent 38%
    ),
    linear-gradient(
      to bottom,
      #738b58,
      #526842 68%,
      #3e5135
    );

  transform:perspective(700px) rotateX(4deg);
  transform-origin:bottom;
}

/* 草地光线 */
.lawn-light{
  position:absolute;
  z-index:4;

  left:20%;
  bottom:-10%;

  width:60%;
  height:80%;

  background:
    radial-gradient(
      ellipse,
      rgba(238,211,158,.27),
      transparent 65%
    );

  filter:blur(15px);
}

/* =========================
   落叶
========================= */

.leaves{
  position:absolute;
  inset:43% 0 0;
  z-index:6;
  pointer-events:none;
}

.leaf{
  position:absolute;

  width:24px;
  height:18px;

  background:#b76532;

  clip-path:polygon(
    50% 0,
    62% 28%,
    90% 13%,
    77% 42%,
    100% 55%,
    68% 61%,
    73% 100%,
    50% 75%,
    27% 100%,
    32% 62%,
    0 55%,
    23% 42%,
    10% 13%,
    39% 28%
  );

  opacity:.88;
}

/* 地上不同位置的叶子 */

.l1{left:8%;bottom:24%;transform:rotate(18deg) scale(.8)}
.l2{left:16%;bottom:12%;background:#d08a3d;transform:rotate(-25deg)}
.l3{left:27%;bottom:31%;background:#93472d;transform:rotate(45deg) scale(.7)}
.l4{left:36%;bottom:18%;background:#c97632;transform:rotate(-15deg)}
.l5{left:47%;bottom:10%;background:#a74b2c;transform:rotate(30deg) scale(.8)}
.l6{left:56%;bottom:25%;background:#d69a45;transform:rotate(-30deg)}
.l7{left:66%;bottom:14%;background:#a84c2c;transform:rotate(12deg)}
.l8{left:76%;bottom:31%;background:#c87832;transform:rotate(-40deg) scale(.75)}
.l9{left:88%;bottom:18%;background:#93452c;transform:rotate(25deg)}
.l10{left:93%;bottom:35%;background:#d49a45;transform:rotate(-15deg) scale(.7)}

.l11{left:20%;bottom:43%;background:#b9582e;transform:rotate(35deg) scale(.6)}
.l12{left:72%;bottom:45%;background:#d18b39;transform:rotate(-20deg) scale(.65)}
.l13{left:43%;bottom:38%;background:#91432b;transform:rotate(60deg) scale(.55)}
.l14{left:58%;bottom:43%;background:#c36b32;transform:rotate(-45deg) scale(.7)}

/* =========================
   微风
========================= */

.breeze{
  position:absolute;
  inset:0;
  z-index:8;
  pointer-events:none;
}

.wind{
  position:absolute;

  width:150px;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3),
    transparent
  );

  opacity:0;

  animation:wind 8s linear infinite;
}

.w1{top:42%;left:-160px}
.w2{top:54%;left:-250px;animation-delay:3s}
.w3{top:62%;left:-180px;animation-delay:5s}

@keyframes wind{
  0%{
    transform:translateX(0) rotate(-8deg);
    opacity:0;
  }

  15%{opacity:.6}

  85%{opacity:.2}

  100%{
    transform:translateX(125vw) rotate(-8deg);
    opacity:0;
  }
}

/* 被风带起来的少量叶子 */

.flying{
  position:absolute;
  z-index:9;

  width:20px;
  height:15px;

  background:#bd6934;

  clip-path:polygon(
    50% 0,62% 28%,90% 13%,77% 42%,
    100% 55%,68% 61%,73% 100%,
    50% 75%,27% 100%,32% 62%,
    0 55%,23% 42%,10% 13%,39% 28%
  );

  animation:fly 9s linear infinite;
}

.f1{top:54%;left:12%}
.f2{top:62%;left:36%;animation-delay:4s;background:#d18a3c}
.f3{top:48%;left:68%;animation-delay:2s;background:#98462c}

@keyframes fly{
  0%{
    transform:translate(0,0) rotate(0);
    opacity:0;
  }

  15%{opacity:.8}

  50%{
    transform:translate(180px,60px) rotate(180deg);
  }

  100%{
    transform:translate(430px,100px) rotate(360deg);
    opacity:0;
  }
}

/* =========================
   文字
========================= */

.nav{
  position:absolute;
  z-index:20;

  top:30px;
  left:6vw;
  right:6vw;

  display:flex;
  justify-content:space-between;

  font-size:10px;
  letter-spacing:4px;

  color:rgba(255,255,255,.85);
}

.content{
  position:absolute;
  z-index:20;

  left:7vw;
  bottom:9vh;

  max-width:600px;

  text-shadow:
    0 2px 18px rgba(35,30,22,.45);
}

.small{
  font-size:10px;
  letter-spacing:6px;
  margin-bottom:20px;
}

h1{
  font-size:clamp(52px,9vw,110px);
  font-weight:400;
  letter-spacing:5px;
  line-height:.9;
}

.zh{
  margin-top:22px;

  font-size:28px;
  letter-spacing:12px;
}

.desc{
  margin-top:20px;

  font-size:14px;
  line-height:2;

  color:rgba(255,255,255,.88);
}

.enter{
  display:inline-block;

  margin-top:28px;
  padding:13px 22px;

  border:1px solid rgba(255,255,255,.55);
  border-radius:40px;

  color:#fff;
  text-decoration:none;

  font-size:10px;
  letter-spacing:3px;

  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}

/* =========================
   第二屏
========================= */

.today{
  min-height:80vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ded1b9;

  color:#463b30;

  text-align:center;
}

.today-inner{
  width:min(650px,88%);
}

.today-label{
  font-size:10px;
  letter-spacing:6px;
  opacity:.55;
}

.today h2{
  margin:25px 0;

  font-size:clamp(38px,6vw,70px);
  font-weight:400;
}

.today p{
  line-height:2.2;
  font-size:16px;
}

footer{
  padding:35px;

  text-align:center;

  background:#30291f;

  font-size:10px;
  letter-spacing:5px;

  color:rgba(255,255,255,.55);
}

/* =========================
   手机
========================= */

@media(max-width:600px){

  .house{
    width:170px;
    height:90px;
    bottom:48%;
  }

  .house:before{
    left:-18px;
    top:-42px;

    border-left-width:103px;
    border-right-width:103px;
    border-bottom-width:52px;
  }

  .house:after{
    width:34px;
    height:34px;
    left:22px;
    top:25px;
  }

  .content{
    left:7vw;
    right:7vw;
    bottom:8vh;
  }

  h1{
    font-size:47px;
    letter-spacing:2px;
  }

  .zh{
    font-size:22px;
    letter-spacing:8px;
  }

  .desc{
    font-size:13px;
  }

  .leaf{
    transform:scale(.7);
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="sky"></div>

  <div class="tree-line"></div>

  <div class="house"></div>

  <div class="lawn"></div>

  <div class="lawn-light"></div>

  <!-- 地面枫叶 -->
  <div class="leaves">
    <span class="leaf l1"></span>
    <span class="leaf l2"></span>
    <span class="leaf l3"></span>
    <span class="leaf l4"></span>
    <span class="leaf l5"></span>
    <span class="leaf l6"></span>
    <span class="leaf l7"></span>
    <span class="leaf l8"></span>
    <span class="leaf l9"></span>
    <span class="leaf l10"></span>
    <span class="leaf l11"></span>
    <span class="leaf l12"></span>
    <span class="leaf l13"></span>
    <span class="leaf l14"></span>
  </div>

  <!-- 凉风 -->
  <div class="breeze">
    <span class="wind w1"></span>
    <span class="wind w2"></span>
    <span class="wind w3"></span>
  </div>

  <!-- 少量被风吹起的叶子 -->
  <span class="flying f1"></span>
  <span class="flying f2"></span>
  <span class="flying f3"></span>

  <div class="nav">
    <span>YUAN LUO XING</span>
    <span id="date"></span>
  </div>

  <div class="content">

    <div class="small">A QUIET PLACE</div>

    <h1>YUAN<br>LUO XING</h1>

    <div class="zh">圆落星</div>

    <p class="desc">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </p>

    <a class="enter" href="#today">
      ENTER MY WORLD →
    </a>

  </div>

</section>


<section class="today" id="today">

  <div class="today-inner">

    <div class="today-label">A PLACE FOR MEMORY</div>

    <h2 id="todayDate"></h2>

    <p id="quote"></p>

  </div>

</section>


<footer>
  YUAN LUO XING
</footer>


<script>

const now = new Date();

const year = now.getFullYear();
const month = String(now.getMonth()+1).padStart(2,"0");
const day = String(now.getDate()).padStart(2,"0");

document.getElementById("date").textContent =
  `${year}.${month}.${day}`;

document.getElementById("todayDate").textContent =
  `${year}.${month}.${day}`;

const quotes = [
  "有些喜欢，不需要说出来，也会一直留在那里。",
  "慢一点，很多美好的东西都来得及。",
  "今天也值得被好好记住。",
  "风吹过的时候，时间也变得很轻。",
  "有些瞬间很短，却值得记很久。",
  "愿喜欢的，都慢慢留下来。",
  "生活不必急着抵达，沿途也很好。"
];

const dayNumber =
  Math.floor(now.getTime()/86400000);

document.getElementById("quote").textContent =
  quotes[dayNumber % quotes.length];

</script>

</body>
</html>
