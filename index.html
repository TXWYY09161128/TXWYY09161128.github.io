<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUAN LUO XING</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#17130f;
  color:white;
}

/* ===== 背景 ===== */

.hero{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(25,20,16,.15),
      rgba(25,18,13,.35)
    ),
    url("photo.jpg") center/cover no-repeat;

  display:flex;
  align-items:flex-end;
  padding:7vw;
}

/* 没照片时的背景 */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(238,190,119,.5),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #9b603d,
      #49382d 48%,
      #191512
    );
}

/* 柔光 */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;

  background:
    radial-gradient(
      circle at 72% 25%,
      rgba(255,215,154,.28),
      transparent 25%
    ),
    linear-gradient(
      to top,
      rgba(0,0,0,.72),
      transparent 55%
    );
}

/* ===== 顶部 ===== */

.nav{
  position:absolute;
  top:30px;
  left:7vw;
  right:7vw;
  z-index:5;

  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:11px;
  letter-spacing:4px;
  color:rgba(255,255,255,.8);
}

/* ===== 文字 ===== */

.content{
  position:relative;
  z-index:5;
  max-width:850px;
}

.kicker{
  font-size:11px;
  letter-spacing:6px;
  margin-bottom:22px;
  opacity:.75;
}

h1{
  font-size:clamp(55px,10vw,130px);
  font-weight:300;
  line-height:.9;
  letter-spacing:-3px;
}

.chinese{
  margin-top:24px;
  font-size:clamp(20px,3vw,34px);
  letter-spacing:14px;
  font-weight:300;
}

.desc{
  margin-top:25px;
  max-width:480px;

  font-size:14px;
  line-height:2;

  color:rgba(255,255,255,.78);
}

/* ===== 按钮 ===== */

.enter{
  display:inline-flex;
  margin-top:35px;

  padding:14px 22px;

  border:1px solid rgba(255,255,255,.4);
  border-radius:100px;

  color:white;
  text-decoration:none;

  font-size:10px;
  letter-spacing:3px;

  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);

  transition:.4s;
}

.enter:hover{
  background:rgba(255,255,255,.2);
  transform:translateY(-3px);
}

/* ===== 第二屏 ===== */

.memory{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12vw 7vw;

  background:
    radial-gradient(
      circle at 50% 20%,
      #5d4332,
      #211914 65%
    );
}

.memory-inner{
  width:min(900px,100%);
  text-align:center;
}

.memory-label{
  font-size:10px;
  letter-spacing:6px;
  opacity:.55;
}

.memory h2{
  margin:25px 0;

  font-size:clamp(35px,6vw,75px);
  font-weight:300;
}

.memory p{
  max-width:600px;
  margin:auto;

  line-height:2.2;
  font-size:15px;

  color:rgba(255,255,255,.65);
}

/* ===== 日期 ===== */

.date{
  margin-top:55px;

  display:flex;
  justify-content:center;
  gap:30px;

  font-size:11px;
  letter-spacing:4px;
  opacity:.55;
}

/* ===== 底部 ===== */

footer{
  padding:50px 7vw;

  display:flex;
  justify-content:space-between;

  background:#120f0c;

  font-size:9px;
  letter-spacing:4px;

  color:rgba(255,255,255,.4);
}

/* ===== 风 ===== */

.breeze{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}

.breeze span{
  position:absolute;

  width:130px;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );

  transform:rotate(-12deg);

  animation:breeze 8s linear infinite;
}

.breeze span:nth-child(1){
  top:35%;
  left:-150px;
}

.breeze span:nth-child(2){
  top:50%;
  left:-300px;
  animation-delay:3s;
}

.breeze span:nth-child(3){
  top:65%;
  left:-250px;
  animation-delay:5s;
}

@keyframes breeze{

  0%{
    transform:translateX(0) rotate(-12deg);
    opacity:0;
  }

  20%{
    opacity:.7;
  }

  100%{
    transform:translateX(130vw) rotate(-12deg);
    opacity:0;
  }
}

/* ===== 手机 ===== */

@media(max-width:600px){

  .hero{
    padding:12vw 7vw;
  }

  .nav{
    top:22px;
  }

  h1{
    letter-spacing:-2px;
  }

  .chinese{
    letter-spacing:8px;
  }

  .desc{
    font-size:13px;
  }

  footer{
    flex-direction:column;
    gap:15px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="nav">
    <span>YUAN LUO XING</span>
    <span id="date"></span>
  </div>

  <div class="breeze">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="content">

    <div class="kicker">
      A QUIET PLACE
    </div>

    <h1>
      YUAN<br>
      LUO XING
    </h1>

    <div class="chinese">
      圆落星
    </div>

    <p class="desc">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </p>

    <a class="enter" href="#memory">
      ENTER MY WORLD →
    </a>

  </div>

</section>


<section class="memory" id="memory">

  <div class="memory-inner">

    <div class="memory-label">
      A PLACE FOR MEMORY
    </div>

    <h2>
      把喜欢的留下。
    </h2>

    <p>
      有些风景只经过一次，<br>
      有些人却会在记忆里停留很久。
    </p>

    <div class="date">
      <span>TODAY</span>
      <span id="today"></span>
    </div>

  </div>

</section>


<footer>

  <span>YUAN LUO XING</span>

  <span>© <span id="year"></span></span>

</footer>


<script>

const now = new Date();

const year = now.getFullYear();
const month = String(now.getMonth()+1).padStart(2,"0");
const day = String(now.getDate()).padStart(2,"0");

document.getElementById("date").textContent =
  `${year}.${month}.${day}`;

document.getElementById("today").textContent =
  `${year}.${month}.${day}`;

document.getElementById("year").textContent =
  year;

</script>

</body>
</html>
