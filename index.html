<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星的个人主页</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#020617;
color:white;
min-height:100vh;
overflow-x:hidden;
}

/* 星空背景 */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
top:-50%;
left:-50%;
background-image:
radial-gradient(white 1px,transparent 1px);
background-size:50px 50px;
animation:stars 20s linear infinite;
opacity:.35;
z-index:-1;
}

@keyframes stars{
from{
transform:translateY(0);
}
to{
transform:translateY(100px);
}
}


/* 流星 */
.meteor{
position:fixed;
width:2px;
height:120px;
background:linear-gradient(white,transparent);
transform:rotate(-45deg);
animation:shoot 5s infinite;
opacity:.8;
}

@keyframes shoot{
0%{
top:-150px;
right:0;
}
100%{
top:100vh;
right:100%;
}
}


.container{
max-width:900px;
margin:auto;
padding:25px;
}


nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
}


.logo{
font-size:24px;
font-weight:bold;
}


.nav-btn{
padding:10px 18px;
border:1px solid #555;
border-radius:20px;
color:white;
text-decoration:none;
}


/* 主标题 */
.hero{
min-height:75vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}


.hero h1{
font-size:60px;
margin-bottom:20px;

background:linear-gradient(
90deg,
#ffffff,
#8b5cf6,
#38bdf8
);

-webkit-background-clip:text;
color:transparent;

animation:glow 2s infinite alternate;
}


/* 名字发光 */
@keyframes glow{

from{
filter:drop-shadow(0 0 10px #8b5cf6);
}

to{
filter:drop-shadow(0 0 30px #38bdf8);
}

}


.hero p{
color:#cbd5e1;
font-size:18px;
line-height:1.8;
}


.button{
margin-top:30px;
padding:14px 30px;
border-radius:30px;
background:white;
color:#111;
text-decoration:none;
font-weight:bold;
}


.card{
margin-top:30px;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
}


.card h2{
margin-bottom:15px;
}


.card p{
color:#cbd5e1;
line-height:1.8;
}


footer{
text-align:center;
padding:40px 0;
color:#94a3b8;
}


@media(max-width:600px){

.hero h1{
font-size:42px;
}

}
</style>

</head>
<body>

<div class="meteor"></div>

<div class="container">

<nav>
  <div class="logo">🌙 圆落星</div>
  <a class="nav-btn" href="#about">关于我</a>
</nav>


<section class="hero">

<h1>你好，我是圆落星</h1>

<p>
欢迎来到我的星空个人主页。<br>
追逐星光 · 热爱生活 · 创造属于自己的故事
</p>

<a class="button" href="#about">
探索更多
</a>

</section>



<section class="card" id="about">

<h2>✨ 关于我</h2>

<p>
我是圆落星，一个喜欢探索、创造和记录的人。<br>
这里会分享我的想法、作品、兴趣以及成长旅程。
</p>

</section>



<section class="card">

<h2>🚀 我的作品</h2>

<p>
这里可以展示我的摄影、设计、项目、
AI创作或者任何值得分享的作品。
</p>

</section>



<section class="card">

<h2>⭐ 我的兴趣</h2>

<p>
🌌 星空<br>
🎨 创意设计<br>
💻 科技探索<br>
📷 记录美好瞬间
</p>

</section>



<section class="card">

<h2>📩 联系我</h2>

<p>
邮箱：你的邮箱<br>
社交账号：你的账号
</p>

</section>



<footer>
© 2026 圆落星 · 星空个人主页
</footer>


</div>


</body>
</html>
