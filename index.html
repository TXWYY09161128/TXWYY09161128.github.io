<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星 · A QUIET PLACE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#081522;
    color:#f5f1e8;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.05),
            transparent 35%
        );
}

/* =========================
   首页
   ========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(4,13,23,.18),
            rgba(4,13,23,.30)
        ),
        url("https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=2200&q=90");

    background-size:cover;
    background-position:center;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(4,13,23,.05),
            rgba(4,13,23,.18) 55%,
            #081522 100%
        );

    pointer-events:none;
}

.top-left,
.top-right{
    position:absolute;
    z-index:5;
    top:35px;

    font-size:9px;
    line-height:1.9;
    letter-spacing:3px;
    color:rgba(255,255,255,.8);
}

.top-left{
    left:5%;
}

.top-right{
    right:5%;
    text-align:right;
}

.hero-center{
    position:relative;
    z-index:5;

    width:90%;
    max-width:850px;

    text-align:center;

    text-shadow:
        0 3px 20px rgba(0,0,0,.4);
}

.kicker{
    font-size:10px;
    letter-spacing:8px;
    margin-bottom:20px;

    opacity:0;
    animation:fadeUp 1.2s .2s forwards;
}

.hero-title{
    font-size:clamp(58px,9vw,105px);
    font-weight:300;
    letter-spacing:14px;

    opacity:0;
    animation:fadeUp 1.3s .35s forwards;
}

.hero-sub{
    margin-top:13px;

    font-size:10px;
    letter-spacing:6px;

    opacity:0;
    animation:fadeUp 1.2s .5s forwards;
}

.enter{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-top:42px;

    padding:14px 30px;

    border:1px solid rgba(255,255,255,.55);
    border-radius:50px;

    color:#fff;
    background:rgba(0,0,0,.16);

    text-decoration:none;

    font-size:10px;
    letter-spacing:3px;

    backdrop-filter:blur(8px);

    transition:
        background .4s,
        transform .4s,
        border-color .4s;

    opacity:0;
    animation:fadeUp 1.2s .7s forwards;
}

.enter:hover{
    background:rgba(255,255,255,.16);
    border-color:#fff;
    transform:translateY(-3px);
}

.datetime{
    margin-top:48px;

    font-size:11px;
    letter-spacing:2px;

    color:rgba(255,255,255,.9);
}

.day-counter{
    margin-top:10px;

    font-size:10px;
    letter-spacing:2px;

    color:rgba(255,255,255,.7);
}

/* =========================
   主体
   ========================= */

.section{
    padding:110px 25px;
    background:#081522;
}

.inner{
    width:100%;
    max-width:1120px;
    margin:auto;
}

.section-head{
    text-align:center;
    margin-bottom:48px;
}

.section-small{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;

    font-size:9px;
    letter-spacing:5px;
    color:#aab5c1;
}

.section-small::before,
.section-small::after{
    content:"";
    width:60px;
    height:1px;

    background:rgba(255,255,255,.35);
}

.section-title{
    margin-top:15px;

    font-size:30px;
    font-weight:300;
    letter-spacing:7px;

    color:#f5f1e8;
}

/* =========================
   信息卡
   ========================= */

.info-grid{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.info-card{
    min-height:190px;

    padding:30px;

    position:relative;
    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(34,59,86,.88),
            rgba(11,27,43,.92)
        );

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);

    opacity:0;
    transform:translateY(30px);

    transition:
        opacity .9s,
        transform .9s;
}

.info-card::after{
    content:"";
    position:absolute;

    width:150px;
    height:150px;

    right:-50px;
    top:-50px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 70%
        );
}

.info-card.show{
    opacity:1;
    transform:translateY(0);
}

.info-label{
    position:relative;
    z-index:2;

    font-size:9px;
    letter-spacing:4px;

    color:#c1cad3;

    margin-bottom:30px;
}

.info-value{
    position:relative;
    z-index:2;

    font-size:17px;
    line-height:2;

    color:#fff;
}

/* =========================
   照片
   ========================= */

.photo-section{
    padding-top:50px;
    padding-bottom:140px;
}

.photo-window{
    width:100%;
    overflow:hidden;
    position:relative;
}

.photo-track{
    display:flex;
    gap:14px;

    width:max-content;

    animation:
        photoLoop
        70s
        linear
        infinite;

    will-change:transform;
}

.photo-track:hover{
    animation-play-state:running;
}

.photo-card{
    width:170px;
    height:125px;

    flex:none;

    overflow:hidden;

    position:relative;

    cursor:pointer;

    border-radius:7px;

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);
}

.photo-card img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .8s ease;
}

.photo-card:hover img{
    transform:scale(1.06);
}

@keyframes photoLoop{

    from{
        transform:translateX(0);
    }

    to{
        transform:
            translateX(
                calc(-50% - 7px)
            );
    }
}

.photo-message{
    width:100%;
    padding:60px;

    text-align:center;

    color:#8997a5;
}

/* =========================
   图片放大
   ========================= */

.lightbox{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        rgba(2,8,15,.92);

    backdrop-filter:blur(18px);

    opacity:0;
    visibility:hidden;

    transition:.35s;
}

.lightbox.active{
    opacity:1;
    visibility:visible;
}

.lightbox img{
    max-width:90vw;
    max-height:88vh;

    object-fit:contain;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
}

.close-lightbox{
    position:absolute;

    right:30px;
    top:25px;

    width:42px;
    height:42px;

    border:
        1px solid
        rgba(255,255,255,.45);

    border-radius:50%;

    color:#fff;
    background:transparent;

    font-size:22px;

    cursor:pointer;
}

/* =========================
   页脚
   ========================= */

.footer{
    padding:55px 25px 80px;

    text-align:center;

    font-size:9px;
    letter-spacing:5px;

    color:#7e8c99;

    background:#081522;
}

/* =========================
   动画
   ========================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   手机
   ========================= */

@media(max-width:700px){

    .hero{
        min-height:100svh;

        background-position:
            62% center;
    }

    .top-left,
    .top-right{
        top:24px;

        font-size:7px;
        letter-spacing:2px;
    }

    .hero-title{
        font-size:55px;
        letter-spacing:8px;
    }

    .hero-sub{
        font-size:8px;
        letter-spacing:4px;
    }

    .datetime{
        margin-top:38px;
        font-size:10px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .section{
        padding:
            90px
            18px;
    }

    .section-title{
        font-size:25px;
        letter-spacing:5px;
    }

    .photo-card{
        width:155px;
        height:115px;
    }
}

</style>
</head>

<body>

<!-- =========================
     首页
     英国照片
     ========================= -->

<header class="hero">

    <div class="top-left">
        2026<br>
        ✦ LIGHT · NIGHT
    </div>

    <div class="top-right">
        SHINING<br>
        IN SILENCE
    </div>

    <div class="hero-center">

        <div class="kicker">
            A QUIET PLACE
        </div>

        <div class="hero-title">
            圆落星
        </div>

        <div class="hero-sub">
            A PLACE FOR MEMORY
        </div>

        <a
            href="#today"
            class="enter">
            ENTER MY WORLD →
        </a>

        <div
            class="datetime"
            id="datetime">
            正在读取时间…
        </div>

        <div
            class="day-counter"
            id="dayCounter">
        </div>

    </div>

</header>


<!-- =========================
     今天
     ========================= -->

<section
    class="section"
    id="today">

    <div class="inner">

        <div class="section-head">

            <div class="section-small">
                TODAY
            </div>

            <div class="section-title">
                今天的世界
            </div>

        </div>


        <div class="info-grid">


            <div class="info-card">

                <div class="info-label">
                    MOON · 月相
                </div>

                <div
                    class="info-value"
                    id="moonPhase">
                    正在读取…
                </div>

            </div>


            <div class="info-card">

                <div class="info-label">
                    SEASON · 季节
                </div>

                <div
                    class="info-value"
                    id="season">
                    正在读取…
                </div>

            </div>


            <div class="info-card">

                <div class="info-label">
                    WEATHER · 上海
                </div>

                <div
                    class="info-value"
                    id="weather">
                    正在读取天气…
                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     我的照片
     ========================= -->

<section
    class="section photo-section">

    <div class="inner">

        <div class="section-head">

            <div class="section-small">
                MY MEMORIES
            </div>

            <div class="section-title">
                我的照片
            </div>

        </div>


        <div class="photo-window">

            <div
                class="photo-track"
                id="photoTrack">

                <div class="photo-message">
                    正在读取照片…
                </div>

            </div>

        </div>

    </div>

</section>


<footer class="footer">
    A PLACE FOR MEMORY · 2026
</footer>


<!-- =========================
     图片查看
     ========================= -->

<div
    class="lightbox"
    id="lightbox">

    <button
        class="close-lightbox"
        id="closeLightbox"
        aria-label="关闭">
        ×
    </button>

    <img
        id="lightboxImg"
        alt="Memory">

</div>


<script>

/* =========================
   上海时间
   ========================= */

function updateDateTime(){

    const formatter =
        new Intl.DateTimeFormat(
            "zh-CN",
            {
                timeZone:
                    "Asia/Shanghai",

                year:"numeric",
                month:"long",
                day:"numeric",
                weekday:"long",

                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",

                hour12:false
            }
        );

    document.getElementById(
        "datetime"
    ).textContent =
        formatter.format(
            new Date()
        );
}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);


/* =========================
   第几天
   ========================= */

function updateDayCounter(){

    const start =
        new Date(
            "2026-01-01T00:00:00+08:00"
        );

    const now =
        new Date();

    const diff =
        Math.floor(
            (
                now - start
            ) /
            (
                1000 *
                60 *
                60 *
                24
            )
        ) + 1;

    document.getElementById(
        "dayCounter"
    ).textContent =
        "2026 · 第 " +
        diff +
        " 天";
}

updateDayCounter();

setInterval(
    updateDayCounter,
    60000
);


/* =========================
   月相
   ========================= */

function getMoonPhase(){

    const knownNewMoon =
        new Date(
            "2000-01-06T18:14:00Z"
        );

    const now =
        new Date();

    const days =
        (
            now -
            knownNewMoon
        ) / 86400000;

    const cycle =
        29.530588853;

    const phase =
        (
            (
                days %
                cycle
            ) +
            cycle
        ) %
        cycle;

    if(phase < 1.84566)
        return "🌑 新月";

    if(phase < 5.53699)
        return "🌒 娥眉月";

    if(phase < 9.22831)
        return "🌓 上弦月";

    if(phase < 12.91963)
        return "🌔 盈凸月";

    if(phase < 16.61096)
        return "🌕 满月";

    if(phase < 20.30228)
        return "🌖 亏凸月";

    if(phase < 23.99361)
        return "🌗 下弦月";

    if(phase < 27.68493)
        return "🌘 残月";

    return "🌑 新月";
}

document.getElementById(
    "moonPhase"
).textContent =
    getMoonPhase();


/* =========================
   中国节气季节
   ========================= */

function solarLongitude(date){

    const JD =
        date.getTime()
        / 86400000
        + 2440587.5;

    const T =
        (
            JD -
            2451545.0
        ) / 36525;

    const rad =
        Math.PI / 180;

    let L0 =
        280.46646 +
        36000.76983 * T +
        0.0003032 * T * T;

    L0 =
        (
            (L0 % 360)
            + 360
        ) % 360;

    const M =
        357.52911 +
        35999.05029 * T -
        0.0001537 * T * T;

    const Mrad =
        M * rad;

    const C =
        Math.sin(Mrad) *
        (
            1.914602 -
            0.004817 * T -
            0.000014 * T * T
        )
        +
        Math.sin(2 * Mrad) *
        (
            0.019993 -
            0.000101 * T
        )
        +
        Math.sin(3 * Mrad)
        * 0.000289;

    const trueLongitude =
        L0 + C;

    const omega =
        (
            125.04 -
            1934.136 * T
        ) * rad;

    const apparentLongitude =
        trueLongitude -
        0.00569 -
        0.00478 *
        Math.sin(omega);

    return (
        (
            apparentLongitude
            % 360
        ) + 360
    ) % 360;
}


function getChinaSeason(){

    const longitude =
        solarLongitude(
            new Date()
        );

    if(
        longitude >= 315 ||
        longitude < 45
    ){
        return "🌱 春天";
    }

    if(
        longitude < 135
    ){
        return "☀️ 夏天";
    }

    if(
        longitude < 225
    ){
        return "🍂 秋天";
    }

    return "❄️ 冬天";
}


function updateSeason(){

    const season =
        document.getElementById(
            "season"
        );

    if(season){

        season.textContent =
            getChinaSeason();

    }
}

updateSeason();

setInterval(
    updateSeason,
    3600000
);


/* =========================
   上海天气
   ========================= */

async function loadWeather(){

    const weatherBox =
        document.getElementById(
            "weather"
        );

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=31.2304" +
            "&longitude=121.4737" +
            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m" +
            "&timezone=Asia%2FShanghai";

        const response =
            await fetch(url);

        if(!response.ok)
            throw new Error();

        const data =
            await response.json();

        const current =
            data.current;

        const weatherMap = {

            0:"晴天 ☀️",
            1:"基本晴朗 🌤️",
            2:"局部多云 ⛅",
            3:"阴天 ☁️",
            45:"雾 🌫️",
            48:"雾 🌫️",
            51:"小毛毛雨 🌦️",
            53:"毛毛雨 🌦️",
            55:"毛毛雨 🌦️",
            61:"小雨 🌧️",
            63:"中雨 🌧️",
            65:"大雨 🌧️",
            71:"小雪 ❄️",
            73:"中雪 ❄️",
            75:"大雪 ❄️",
            80:"阵雨 🌦️",
            81:"阵雨 🌦️",
            82:"强阵雨 🌧️",
            95:"雷雨 ⛈️",
            96:"雷雨 ⛈️",
            99:"强雷雨 ⛈️"
        };

        const description =
            weatherMap[
                current.weather_code
            ] ||
            "天气变化中";

        weatherBox.innerHTML =
            description +
            "<br>" +
            Math.round(
                current.temperature_2m
            ) +
            "°C · 体感 " +
            Math.round(
                current.apparent_temperature
            ) +
            "°C" +
            "<br>" +
            "湿度 " +
            Math.round(
                current.relative_humidity_2m
            ) +
            "% · 风速 " +
            Math.round(
                current.wind_speed_10m
            ) +
            " km/h";

    }catch(error){

        weatherBox.textContent =
            "天气暂时无法读取，请稍后刷新";

    }
}

loadWeather();

setInterval(
    loadWeather,
    600000
);


/* =========================
   我的照片
   ========================= */

async function loadPhotos(){

    const track =
        document.getElementById(
            "photoTrack"
        );

    try{

        const response =
            await fetch(
                "photos.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error();

        const photos =
            await response.json();

        if(
            !Array.isArray(photos) ||
            photos.length === 0
        ){

            track.innerHTML =
                '<div class="photo-message">' +
                'photos 文件夹里暂时没有照片' +
                '</div>';

            return;
        }

        const allPhotos =
            photos.concat(
                photos
            );

        track.innerHTML = "";

        allPhotos.forEach(
            function(path){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "photo-card";

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    path +
                    "?v=" +
                    Date.now();

                img.alt =
                    "Memory";

                img.loading =
                    "lazy";

                img.draggable =
                    false;

                card.addEventListener(
                    "click",
                    function(){

                        document.getElementById(
                            "lightboxImg"
                        ).src =
                            img.src;

                        document.getElementById(
                            "lightbox"
                        ).classList.add(
                            "active"
                        );

                    }
                );

                card.appendChild(img);

                track.appendChild(card);

            }
        );

    }catch(error){

        track.innerHTML =
            '<div class="photo-message">' +
            '照片暂时无法读取，请稍后刷新' +
            '</div>';

    }
}

loadPhotos();

setInterval(
    loadPhotos,
    300000
);


/* =========================
   图片关闭
   ========================= */

document.getElementById(
    "closeLightbox"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "lightbox"
        ).classList.remove(
            "active"
        );

    }
);

document.getElementById(
    "lightbox"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            this.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   图片右键 / 拖拽
   ========================= */

document.addEventListener(
    "contextmenu",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);

document.addEventListener(
    "dragstart",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);


/* =========================
   信息卡滚动动画
   ========================= */

const cards =
    document.querySelectorAll(
        ".info-card"
    );

const observer =
    new IntersectionObserver(
        function(entries){

            entries.forEach(
                function(entry){

                    if(
                        entry.isIntersecting
                    ){

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold:.18
        }
    );

cards.forEach(
    function(card){

        observer.observe(card);

    }
);

</script>

</body>
</html>
