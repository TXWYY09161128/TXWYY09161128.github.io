<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:#fff8ed;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "PingFang SC","Microsoft YaHei",sans-serif;
  background:#65452f;
  transition:background 1.5s ease;
}

/* 背景 */
.scene{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
  background:
    radial-gradient(circle at 72% 20%,rgba(255,213,145,.45),transparent 26%),
    linear-gradient(135deg,#a77b50,#68472f 52%,#2d211b);
  transition:background 2s ease;
}

.scene:before{
  content:"";
  position:absolute;
  width:70vw;
  height:70vw;
  right:-25vw;
  top:-28vw;
  border-radius:50%;
  background:rgba(255,202,125,.22);
  filter:blur(40px);
  animation:sun 12s ease-in-out infinite alternate;
}

.scene:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    115deg,
    transparent 25%,
    rgba(255,220,165,.10) 46%,
    transparent 58%
  );
  animation:light 9s ease-in-out infinite alternate;
}

@keyframes sun{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-8vw,7vh) scale(1.12)}
}

@keyframes light{
  from{transform:translateX(-7%)}
  to{transform:translateX(7%)}
}

/* 胶片颗粒 */
.grain{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:.10;
  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      rgba(255,255,255,.35) 0 1px,
      transparent 1px 4px
    );
  background-size:5px 5px;
}

/* 页面 */
.page{
  width:min(1200px,90%);
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:35px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:13px;
  letter-spacing:.2em;
}

.season{
  font-size:10px;
  letter-spacing:.28em;
  opacity:.58;
}

/* 主视觉 */
.hero{
  min-height:78vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:70px;
}

.hero-copy{
  position:relative;
  z-index:5;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.42em;
  opacity:.58;
  margin-bottom:25px;
}

h1{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:clamp(65px,9vw,125px);
  font-weight:400;
  line-height:.9;
  letter-spacing:-.06em;
  margin-bottom:32px;
  text-shadow:0 12px 45px rgba(40,20,8,.3);
}

.subtitle{
  max-width:390px;
  color:rgba(255,248,235,.78);
  font-size:13px;
  line-height:2;
}

.enter{
  display:inline-flex;
  gap:18px;
  margin-top:42px;
  padding-bottom:10px;
  color:#fff2d9;
  text-decoration:none;
  border-bottom:1px solid rgba(255,235,200,.5);
  font-size:10px;
  letter-spacing:.25em;
}

.enter span{
  transition:.4s;
}

.enter:hover span{
  transform:translateX(8px);
}

/* 人物 */
.portrait-wrap{
  position:relative;
  height:min(68vh,680px);
  min-height:470px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.portrait-glow{
  position:absolute;
  width:75%;
  height:80%;
  border-radius:50%;
  background:rgba(255,205,140,.28);
  filter:blur(60px);
}

.portrait{
  position:relative;
  width:min(430px,82%);
  height:94%;
  overflow:hidden;
  border-radius:220px 220px 20px 20px;
  background:linear-gradient(145deg,#d6aa78,#765039 65%,#2e211a);
  box-shadow:
    0 35px 90px rgba(35,18,8,.45),
    inset 0 0 60px rgba(255,220,170,.15);
  transition:transform .2s ease;
}

.portrait img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.portrait.no-photo:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,225,185,.45),
      transparent 18%
    ),
    linear-gradient(135deg,#c99b6d,#704b34 60%,#2c201a);
}

.portrait.no-photo:after{
  content:"";
  position:absolute;
  left:50%;
  top:27%;
  width:38%;
  aspect-ratio:1;
  transform:translateX(-50%);
  border-radius:50%;
  background:linear-gradient(145deg,#dfb487,#76513c);
  box-shadow:0 150px 0 55px rgba(64,39,27,.75);
}

.sun-dots{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 25%,rgba(255,238,190,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 75% 35%,rgba(255,238,190,.25) 0 3px,transparent 4px),
    radial-gradient(circle at 62% 70%,rgba(255,238,190,.20) 0 2px,transparent 3px);
}

/* 飘落元素 */
.leaves{
  position:fixed;
  inset:0;
  z-index:4;
  pointer-events:none;
  overflow:hidden;
}

.leaf{
  position:absolute;
  top:-50px;
  width:17px;
  height:14px;
  border-radius:70% 0 70% 0;
  background:#b86c32;
  opacity:.72;
  filter:drop-shadow(0 4px 6px rgba(40,20,10,.2));
  animation:fall linear infinite;
}

.leaf:after{
  content:"";
  position:absolute;
  left:50%;
  top:-3px;
  width:1px;
  height:20px;
  background:rgba(90,48,25,.5);
  transform:rotate(35deg);
}

.leaf:nth-child(1){left:8%;animation-duration:13s;animation-delay:-3s;transform:scale(.7)}
.leaf:nth-child(2){left:20%;animation-duration:17s;animation-delay:-10s;transform:scale(1.1)}
.leaf:nth-child(3){left:36%;animation-duration:14s;animation-delay:-6s;transform:scale(.65)}
.leaf:nth-child(4){left:52%;animation-duration:19s;animation-delay:-14s;transform:scale(.8)}
.leaf:nth-child(5){left:68%;animation-duration:15s;animation-delay:-8s;transform:scale(1.15)}
.leaf:nth-child(6){left:82%;animation-duration:18s;animation-delay:-5s;transform:scale(.6)}
.leaf:nth-child(7){left:93%;animation-duration:12s;animation-delay:-9s;transform:scale(.9)}

@keyframes fall{
  0%{transform:translate3d(0,-60px,0) rotate(0)}
  45%{transform:translate3d(70px,50vh,0) rotate(150deg)}
  100%{transform:translate3d(-80px,110vh,0) rotate(360deg)}
}

/* 今日 */
.today{
  padding:90px 0 110px;
  display:grid;
  grid-template-columns:.7fr 1.3fr;
  gap:80px;
  border-top:1px solid rgba(255,240,218,.17);
}

.today-label{
  font-size:10px;
  letter-spacing:.35em;
  opacity:.55;
}

.date{
  margin-top:15px;
  font-family:Georgia,serif;
  font-size:28px;
}

.daily{
  max-width:650px;
  font-family:Georgia,"Songti SC",serif;
  font-size:clamp(24px,3vw,42px);
  line-height:1.45;
}

.mood{
  margin-top:25px;
  font-size:10px;
  letter-spacing:.2em;
  opacity:.52;
}

/* 底部 */
footer{
  margin-top:auto;
  padding:28px 0;
  display:flex;
  justify-content:space-between;
  font-size:9px;
  letter-spacing:.22em;
  opacity:.45;
}

/* 滚动 */
.reveal{
  opacity:0;
  transform:translateY(35px);
  transition:opacity 1s ease,transform 1s ease;
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

/* 冬季 */
body.winter .scene{
  background:
    radial-gradient(circle at 70% 20%,rgba(220,235,255,.4),transparent 26%),
    linear-gradient(135deg,#71808a,#414c53 55%,#20272c);
}

body.winter .portrait-glow{
  background:rgba(210,230,255,.2);
}

body.winter .leaf{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.8);
}

body.winter .leaf:after{
  display:none;
}

/* 春季 */
body.spring .scene{
  background:
    radial-gradient(circle at 70% 20%,rgba(255,221,226,.45),transparent 26%),
    linear-gradient(135deg,#b99c8e,#776b63 55%,#403936);
}

body.spring .leaf{
  width:11px;
  height:8px;
  background:#e5a9ae;
}

/* 夏季 */
body.summer .scene{
  background:
    radial-gradient(circle at 72% 18%,rgba(255,239,164,.5),transparent 27%),
    linear-gradient(135deg,#7aa18c,#557c70 50%,#304f49);
}

body.summer .leaf{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#d8c879;
}

/* 手机 */
@media(max-width:800px){

  .page{width:88%}

  header{padding:25px 0}

  .hero{
    min-height:auto;
    grid-template-columns:1fr;
    gap:35px;
    padding:45px 0 90px;
  }

  h1{
    font-size:clamp(62px,18vw,95px);
  }

  .portrait-wrap{
    height:520px;
    min-height:0;
  }

  .portrait{
    width:min(360px,88%);
    height:100%;
  }

  .today{
    grid-template-columns:1fr;
    gap:25px;
    padding:70px 0 90px;
  }

  .daily{font-size:28px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="scene"></div>
<div class="grain"></div>

<div class="leaves">
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
  <div class="leaf"></div>
</div>

<div class="page">

<header>
  <div class="logo">YUAN LUO XING</div>
  <div class="season" id="seasonText">A WARM MEMORY</div>
</header>

<main>

<section class="hero">

  <div class="hero-copy">

    <div class="eyebrow">A PLACE FOR MEMORY</div>

    <h1>圆落星</h1>

    <p class="subtitle">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </p>

    <a href="#today" class="enter">
      ENTER MY WORLD
      <span>→</span>
    </a>

  </div>

  <div class="portrait-wrap">

    <div class="portrait-glow"></div>

    <div class="portrait" id="portrait">
      <img
        src="photo.jpg"
        alt="圆落星"
        onerror="this.style.display='none';document.getElementById('portrait').classList.add('no-photo')"
      >
      <div class="sun-dots"></div>
    </div>

  </div>

</section>

<section class="today reveal" id="today">

  <div>
    <div class="today-label">TODAY</div>
    <div class="date" id="date"></div>
  </div>

  <div>
    <div class="daily" id="dailyText"></div>
    <div class="mood" id="mood"></div>
  </div>

</section>

</main>

<footer>
  <span>YUAN LUO XING</span>
  <span id="year"></span>
</footer>

</div>

<script>

/* 自动日期 */

const now = new Date();

const months = [
  "JANUARY","FEBRUARY","MARCH","APRIL",
  "MAY","JUNE","JULY","AUGUST",
  "SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"
];

document.getElementById("date").textContent =
  `${months[now.getMonth()]} ${now.getDate()}`;

document.getElementById("year").textContent =
  now.getFullYear();


/* 四季自动切换 */

const month = now.getMonth() + 1;

if(month >= 3 && month <= 5){

  document.body.classList.add("spring");

  document.getElementById("seasonText").textContent =
    "A SOFT BEGINNING";

}
else if(month >= 6 && month <= 8){

  document.body.classList.add("summer");

  document.getElementById("seasonText").textContent =
    "A SLOW AFTERNOON";

}
else if(month >= 9 && month <= 11){

  document.getElementById("seasonText").textContent =
    "A WARM MEMORY";

}
else{

  document.body.classList.add("winter");

  document.getElementById("seasonText").textContent =
    "A QUIET NIGHT";

}


/* 每日文字 */

const quotes = [
  "有些喜欢，不需要说出口。",
  "把今天留住，也把自己留住。",
  "慢一点，风景才会留下来。",
  "那些被记住的瞬间，都会发光。",
  "生活不必匆忙，喜欢的东西值得慢慢收藏。",
  "愿每一次回头，都还能看见温柔。",
  "世界很大，也可以给自己留一个安静的角落。",
  "有光的时候，就好好看看光。"
];

const daySeed = Math.floor(
  new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  ).getTime() / 86400000
);

document.getElementById("dailyText").textContent =
  quotes[Math.abs(daySeed) % quotes.length];


/* 时间氛围 */

const hour = now.getHours();

let moodText;

if(hour >= 5 && hour < 11){
  moodText = "SOFT MORNING LIGHT";
}
else if(hour >= 11 && hour < 17){
  moodText = "GOLDEN AFTERNOON";
}
else if(hour >= 17 && hour < 22){
  moodText = "WARM EVENING";
}
else{
  moodText = "QUIET NIGHT";
}

document.getElementById("mood").textContent = moodText;


/* 鼠标轻微视差 */

const portrait = document.getElementById("portrait");

document.addEventListener("mousemove",(e)=>{

  if(window.innerWidth < 800) return;

  const x =
    (e.clientX / window.innerWidth - .5) * 10;

  const y =
    (e.clientY / window.innerHeight - .5) * 8;

  portrait.style.transform =
    `translate(${x}px,${y}px)`;

});


/* 滚动出现 */

const observer = new IntersectionObserver(
  entries => {

    entries.forEach(entry => {

      if(entry.isIntersecting){
        entry.target.classList.add("show");
      }

    });

  },
  {threshold:.15}
);

document
  .querySelectorAll(".reveal")
  .forEach(el => observer.observe(el));

</script>

</body>
</html>
