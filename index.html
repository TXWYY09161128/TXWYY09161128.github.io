<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>圆落星 · A QUIET PLACE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f8f7f2;
    color:#3d3a46;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    background:
        radial-gradient(circle at 50% 20%,
        rgba(188,174,226,.10),
        transparent 30%);
}

a{
    color:inherit;
}

/* =========================
   首页
   ========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:50px 25px;
}

.top-left{
    position:absolute;
    left:5%;
    top:45px;
    font-size:10px;
    line-height:1.8;
    letter-spacing:2px;
    color:#aaa5af;
}

.top-right{
    position:absolute;
    right:5%;
    top:45px;
    text-align:right;
    font-size:10px;
    line-height:1.8;
    letter-spacing:2px;
    color:#aaa5af;
}

/* =========================
   首页文字
   全部放在拱门外
   ========================= */

.hero-center{
    width:100%;
    max-width:900px;
    text-align:center;
    position:absolute;
    left:50%;
    top:calc(50% + min(285px,36vh));
    transform:translateX(-50%);
    z-index:7;
}

.kicker{
    font-size:10px;
    letter-spacing:7px;
    color:#aaa5af;
    margin-bottom:22px;
    opacity:0;
    animation:fadeUp 1.2s .1s forwards;
}

/* 已删除原来的「圆落星」 */

.hero-sub{
    margin-top:0;
    font-size:11px;
    letter-spacing:5px;
    color:#aaa5af;
    opacity:0;
    animation:fadeUp 1.2s .4s forwards;
}

/* =========================
   原来的拱门
   形状 / 大小 / 中心位置保持原样
   紫色换成第三张照片
   ========================= */

.arch{
    width:min(390px,62vw);
    height:min(510px,65vh);
    min-height:330px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-45%);
    z-index:2;

    overflow:hidden;

    border-radius:220px 220px 0 0;

    box-shadow:
        0 35px 80px rgba(104,91,145,.14);

    opacity:0;
    animation:archIn 1.8s .25s cubic-bezier(.2,.8,.2,1) forwards;
}

/* 第三张照片 */

.arch img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
}

/* 原来的拱门光感 */

.arch::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.18),
            transparent 45%
        );
    pointer-events:none;
}

/* =========================
   月亮
   ========================= */

.moon{
    position:absolute;
    width:72px;
    height:72px;
    border-radius:50%;
    background:#f7e7a9;
    box-shadow:
        0 0 30px rgba(247,231,169,.55);
    right:calc(50% - 245px);
    top:calc(50% - 230px);
    z-index:5;
    opacity:0;
    animation:
        moonIn 1.3s .9s forwards,
        moonFloat 5s 2.2s ease-in-out infinite;
}

.moon::after{
    content:"";
    position:absolute;
    width:72px;
    height:72px;
    border-radius:50%;
    background:#b0a2d4;
    left:20px;
    top:-7px;
}

/* =========================
   小星星
   ========================= */

.star{
    position:absolute;
    z-index:6;
    color:#d5a9c7;
    font-size:15px;
    opacity:0;
}

.star.s1{
    left:calc(50% - 210px);
    top:32%;
    animation:starIn 1s 1s forwards,twinkle 3s 2s infinite;
}

.star.s2{
    left:calc(50% + 190px);
    top:43%;
    font-size:10px;
    animation:starIn 1s 1.3s forwards,twinkle 2.5s 2.2s infinite;
}

.star.s3{
    left:calc(50% - 150px);
    top:57%;
    font-size:8px;
    animation:starIn 1s 1.6s forwards,twinkle 4s 2.5s infinite;
}

/* =========================
   装饰轨迹
   ========================= */

.orbit{
    position:absolute;
    width:500px;
    height:240px;
    border:1px solid rgba(132,118,157,.22);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    z-index:0;
    opacity:0;
    animation:orbitIn 2s 1s forwards;
}

.orbit::before{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#d9b5cf;
    left:12%;
    top:22%;
}

/* =========================
   进入按钮
   ========================= */

.enter{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:25px;
    padding:14px 28px;
    border:1px solid rgba(72,67,81,.25);
    border-radius:50px;
    text-decoration:none;
    font-size:10px;
    letter-spacing:3px;
    color:#514c58;
    background:rgba(255,255,255,.25);
    transition:
        background .4s,
        transform .4s,
        border-color .4s;
    opacity:0;
    animation:fadeUp 1.2s .7s forwards;
}

.enter:hover{
    background:#fff;
    border-color:rgba(72,67,81,.45);
    transform:translateY(-3px);
}

/* =========================
   时间
   ========================= */

.datetime{
    margin-top:16px;
    font-size:12px;
    letter-spacing:1px;
    color:#8f8995;
}

.day-counter{
    margin-top:8px;
    font-size:10px;
    letter-spacing:2px;
    color:#b0abb2;
}

/* =========================
   分区
   ========================= */

.section{
    padding:150px 25px;
}

.inner{
    max-width:1100px;
    margin:auto;
}

.section-head{
    text-align:center;
    margin-bottom:65px;
}

.section-small{
    font-size:9px;
    letter-spacing:5px;
    color:#aaa5af;
    margin-bottom:16px;
}

.section-title{
    font-size:30px;
    font-weight:300;
    letter-spacing:5px;
    color:#4a4653;
}

/* =========================
   信息卡
   ========================= */

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.info-card{
    min-height:180px;
    padding:35px 25px;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(90,82,105,.08);
    border-radius:2px;
    text-align:center;
    box-shadow:0 18px 60px rgba(70,60,90,.05);
    opacity:0;
    transform:translateY(35px);
    transition:
        opacity .9s,
        transform .9s;
}

.info-card.show{
    opacity:1;
    transform:translateY(0);
}

.info-label{
    font-size:9px;
    letter-spacing:3px;
    color:#aaa5af;
    margin-bottom:25px;
}

.info-value{
    font-size:15px;
    line-height:2;
    color:#5b5662;
}

/* =========================
   照片
   ========================= */

.photo-section{
    padding-bottom:180px;
}

.photo-window{
    width:100%;
    overflow:hidden;
    position:relative;
}

.photo-track{
    display:flex;
    gap:20px;
    width:max-content;
    animation:photoLoop 70s linear infinite;
    will-change:transform;
}

.photo-track:hover{
    animation-play-state:running;
}

.photo-card{
    width:235px;
    height:310px;
    flex:none;
    overflow:hidden;
    background:#eeeae4;
    position:relative;
    cursor:pointer;
    border-radius:2px;
    box-shadow:0 20px 55px rgba(60,52,72,.12);
}

.photo-card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    transition:transform .8s ease;
}

.photo-card:hover img{
    transform:scale(1.04);
}

@keyframes photoLoop{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(calc(-50% - 10px));
    }
}

.photo-message{
    width:100%;
    padding:60px;
    text-align:center;
    color:#aaa5af;
}

/* =========================
   图片查看
   ========================= */

.lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(30,27,38,.88);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    opacity:0;
    visibility:hidden;
    transition:.35s;
}

.lightbox.active{
    opacity:1;
    visibility:visible;
}

.lightbox img{
    max-width:90vw;
    max-height:88vh;
    object-fit:contain;
    box-shadow:0 30px 100px rgba(0,0,0,.4);
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
}

.close-lightbox{
    position:absolute;
    right:30px;
    top:25px;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:50%;
    color:#fff;
    background:transparent;
    font-size:22px;
    cursor:pointer;
}

/* =========================
   页脚
   ========================= */

.footer{
    padding:80px 25px 110px;
    text-align:center;
    font-size:9px;
    letter-spacing:5px;
    color:#aaa5af;
}

/* =========================
   动画
   ========================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes archIn{
    from{
        opacity:0;
        transform:translate(-50%,-40%) scale(.88);
    }
    to{
        opacity:1;
        transform:translate(-50%,-45%) scale(1);
    }
}

@keyframes moonIn{
    from{
        opacity:0;
        transform:scale(.5) rotate(-30deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

@keyframes moonFloat{
    0%,100%{
        margin-top:0;
    }
    50%{
        margin-top:-12px;
    }
}

@keyframes starIn{
    from{
        opacity:0;
        transform:scale(0);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes twinkle{
    0%,100%{
        opacity:.35;
    }
    50%{
        opacity:1;
    }
}

@keyframes orbitIn{
    from{
        opacity:0;
        transform:translate(-50%,-50%) rotate(-18deg) scale(.7);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) rotate(-18deg) scale(1);
    }
}

/* =========================
   手机
   ========================= */

@media(max-width:700px){

    .top-right{

    .hero-center{
        top:calc(50% + min(255px,31vh));
    }

    .moon{
        width:48px;
        height:48px;
        right:17%;

    }

    .moon::after{
        width:48px;
        height:48px;
        left:13px;
        top:-5px;
    }

    .orbit{
        width:85vw;

    }

    .star.s1{

    }

    .star.s2{
        left:78%;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .section{
        padding:110px 20px;
    }

    .photo-card{
        width:180px;
        height:240px;
    }
}

<script>

/* =========================
   自动日期 + 时间
   ========================= */

function updateDateTime(){

    const formatter =
        new Intl.DateTimeFormat("zh-CN",{
            timeZone:"Asia/Shanghai",
            year:"numeric",
            month:"long",
            day:"numeric",
            weekday:"long",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        });

    document.getElementById("datetime").textContent =
        formatter.format(new Date());
}

updateDateTime();

setInterval(updateDateTime,1000);

/* =========================
   天数
   ========================= */

function updateDayCounter(){

    const start =
        new Date("2026-01-01T00:00:00+08:00");

    const now =
        new Date();

    const diff =
        Math.floor(
            (now - start) /
            (1000 * 60 * 60 * 24)
        ) + 1;

    document.getElementById("dayCounter").textContent =
        "2026 · 第 " + diff + " 天";
}

updateDayCounter();

setInterval(updateDayCounter,60000);

/* =========================
   月相
   ========================= */

function getMoonPhase(){

    const knownNewMoon =
        new Date("2000-01-06T18:14:00Z");

    const now =
        new Date();

    const days =
        (now - knownNewMoon) /
        86400000;

    const cycle =
        29.530588853;

    const phase =
        ((days % cycle) + cycle) % cycle;

    if(phase < 1.84566)
        return "🌑 新月";

    if(phase < 5.53699)
        return "🌒 娥眉月";

    if(phase < 9.22831)
        return "🌓 上弦月";

    if(phase < 12.91963)
        return "🌔 盈凸月";

    if(phase < 16.61096)
        return "🌕 满月";

    if(phase < 20.30228)
        return "🌖 亏凸月";

    if(phase < 23.99361)
        return "🌗 下弦月";

    if(phase < 27.68493)
        return "🌘 残月";

    return "🌑 新月";
}

document.getElementById("moonPhase").textContent =
    getMoonPhase();

/* =========================
   中国节气季节
   根据太阳黄经计算
   立春 315°
   立夏 45°
   立秋 135°
   立冬 225°
   ========================= */

function solarLongitude(date){

    const JD =
        date.getTime() / 86400000 +
        2440587.5;

    const T =
        (JD - 2451545.0) / 36525;

    const rad =
        Math.PI / 180;

    let L0 =
        280.46646 +
        36000.76983 * T +
        0.0003032 * T * T;

    L0 =
        ((L0 % 360) + 360) % 360;

    const M =
        357.52911 +
        35999.05029 * T -
        0.0001537 * T * T;

    const Mrad =
        M * rad;

    const C =
        Math.sin(Mrad) *
        (
            1.914602 -
            0.004817 * T -
            0.000014 * T * T
        )
        +
        Math.sin(2 * Mrad) *
        (
            0.019993 -
            0.000101 * T
        )
        +
        Math.sin(3 * Mrad) *
        0.000289;

    const trueLongitude =
        L0 + C;

    const omega =
        (125.04 - 1934.136 * T) * rad;

    const apparentLongitude =
        trueLongitude -
        0.00569 -
        0.00478 *
        Math.sin(omega);

    return (
        (apparentLongitude % 360) +
        360
    ) % 360;
}

function angleDifference(a,b){

    let d =
        a - b;

    while(d > 180)
        d -= 360;

    while(d < -180)
        d += 360;

    return d;
}

function findSolarTerm(
    year,
    targetAngle,
    approxMonth,
    approxDay
){

    const start =
        new Date(
            `${year}-${String(approxMonth).padStart(2,"0")}-${String(approxDay).padStart(2,"0")}T00:00:00+08:00`
        );

    let left =
        new Date(
            start.getTime() -
            3 * 86400000
        );

    let right =
        new Date(
            start.getTime() +
            3 * 86400000
        );

    for(let i = 0; i < 45; i++){

        const middle =
            new Date(
                (
                    left.getTime() +
                    right.getTime()
                ) / 2
            );

        const diff =
            angleDifference(
                solarLongitude(middle),
                targetAngle
            );

        if(diff > 0){

            right = middle;

        }else{

            left = middle;

        }
    }

    return new Date(
        (
            left.getTime() +
            right.getTime()
        ) / 2
    );
}

function getFourSeasons(year){

    return {

        lichun:
            findSolarTerm(
                year,
                315,
                2,
                4
            ),

        lixia:
            findSolarTerm(
                year,
                45,
                5,
                5
            ),

        liqiu:
            findSolarTerm(
                year,
                135,
                8,
                7
            ),

        lidong:
            findSolarTerm(
                year,
                225,
                11,
                7
            ),

        nextLichun:
            findSolarTerm(
                year + 1,
                315,
                2,
                4
            )
    };
}

function getChinaSeason(){

    const now =
        new Date();

    const chinaYear =
        Number(
            new Intl.DateTimeFormat(
                "zh-CN",
                {
                    timeZone:
                        "Asia/Shanghai",

                    year:
                        "numeric"
                }
            ).format(now)
        );

    const seasons =
        getFourSeasons(
            chinaYear
        );

    if(
        now >= seasons.lichun &&
        now < seasons.lixia
    ){

        return "🌱 春天";

    }

    if(
        now >= seasons.lixia &&
        now < seasons.liqiu
    ){

        return "☀️ 夏天";

    }

    if(
        now >= seasons.liqiu &&
        now < seasons.lidong
    ){

        return "🍂 秋天";

    }

    return "❄️ 冬天";
}

function updateSeason(){

    const season =
        document.getElementById(
            "season"
        );

    if(season){

        season.textContent =
            getChinaSeason();

    }
}

updateSeason();

setInterval(
    updateSeason,
    3600000
);

/* =========================
   上海天气
   ========================= */

async function loadWeather(){

    const weatherBox =
        document.getElementById("weather");

    try{

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=31.2304" +
            "&longitude=121.4737" +
            "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
            "&timezone=Asia%2FShanghai";

        const response =
            await fetch(url);

        if(!response.ok)
            throw new Error();

        const data =
            await response.json();

        const current =
            data.current;

        const weatherMap = {

            0:"晴天 ☀️",
            1:"基本晴朗 🌤️",
            2:"局部多云 ⛅",
            3:"阴天 ☁️",
            45:"雾 🌫️",
            48:"雾 🌫️",
            51:"小毛毛雨 🌦️",
            53:"毛毛雨 🌦️",
            55:"毛毛雨 🌦️",
            61:"小雨 🌧️",
            63:"中雨 🌧️",
            65:"大雨 🌧️",
            71:"小雪 ❄️",
            73:"中雪 ❄️",
            75:"大雪 ❄️",
            80:"阵雨 🌦️",
            81:"阵雨 🌦️",
            82:"强阵雨 🌧️",
            95:"雷雨 ⛈️",
            96:"雷雨 ⛈️",
            99:"强雷雨 ⛈️"
        };

        const description =
            weatherMap[
                current.weather_code
            ] ||
            "天气变化中";

        weatherBox.innerHTML =
            description +
            "<br>" +
            Math.round(
                current.temperature_2m
            ) +
            "°C · 体感 " +
            Math.round(
                current.apparent_temperature
            ) +
            "°C" +
            "<br>" +
            "湿度 " +
            Math.round(
                current.relative_humidity_2m
            ) +
            "% · 风速 " +
            Math.round(
                current.wind_speed_10m
            ) +
            " km/h";

    }catch(error){

        weatherBox.textContent =
            "天气暂时无法读取，请稍后刷新";

    }
}

loadWeather();

setInterval(
    loadWeather,
    600000
);

/* =========================
   照片
   ========================= */

async function loadPhotos(){

    const track =
        document.getElementById(
            "photoTrack"
        );

    try{

        const response =
            await fetch(
                "photos.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error();

        const photos =
            await response.json();

        if(
            !Array.isArray(photos) ||
            photos.length === 0
        ){

            track.innerHTML =
                '<div class="photo-message">' +
                'photos 文件夹里暂时没有照片' +
                '</div>';

            return;
        }

        const allPhotos =
            photos.concat(photos);

        track.innerHTML = "";

        allPhotos.forEach(
            function(path){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "photo-card";

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    path +
                    "?v=" +
                    Date.now();

                img.alt =
                    "Memory";

                img.loading =
                    "lazy";

                img.draggable =
                    false;

                card.addEventListener(
                    "click",
                    function(){

                        document.getElementById(
                            "lightboxImg"
                        ).src =
                            img.src;

                        document.getElementById(
                            "lightbox"
                        ).classList.add(
                            "active"
                        );

                    }
                );

                card.appendChild(img);

                track.appendChild(card);

            }
        );

    }catch(error){

        track.innerHTML =
            '<div class="photo-message">' +
            '照片暂时无法读取，请稍后刷新' +
            '</div>';

    }
}

loadPhotos();

setInterval(
    loadPhotos,
    300000
);

/* =========================
   图片关闭
   ========================= */

document.getElementById(
    "closeLightbox"
).addEventListener(
    "click",
    function(){

        document.getElementById(
            "lightbox"
        ).classList.remove(
            "active"
        );

    }
);

document.getElementById(
    "lightbox"
).addEventListener(
    "click",
    function(e){

        if(e.target === this){

            this.classList.remove(
                "active"
            );

        }

    }
);

/* =========================
   禁止照片普通右键/拖拽
   ========================= */

document.addEventListener(
    "contextmenu",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);

document.addEventListener(
    "dragstart",
    function(e){

        if(
            e.target.tagName === "IMG"
        ){

            e.preventDefault();

        }

    }
);

/* =========================
   滚动出现动画
   ========================= */

const cards =
    document.querySelectorAll(
        ".info-card"
    );

const observer =
    new IntersectionObserver(
        function(entries){

            entries.forEach(
                function(entry){

                    if(
                        entry.isIntersecting
                    ){

                        entry.target.classList.add(
                            "show"
                        );

                    }

                }
            );

        },
        {
            threshold:.18
        }
    );

cards.forEach(
    function(card){

        observer.observe(card);

    }
);

</script>
