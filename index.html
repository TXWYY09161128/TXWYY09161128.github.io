<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>圆落星</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:#f5f2ea;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;

  background:
    radial-gradient(circle at 70% 20%,var(--glow),transparent 30%),
    linear-gradient(145deg,var(--bg1),var(--bg2),var(--bg3));

  transition:background 2s ease;
}


/* =========================
   星空
========================= */

.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.stars,
.stars2,
.stars3{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.stars{
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px);

  background-size:150px 150px,260px 260px;

  animation:starsMove 40s linear infinite;

  opacity:.65;
}

.stars2{
  background-image:
    radial-gradient(circle,rgba(180,200,255,.9) 1.2px,transparent 2px);

  background-size:330px 330px;

  animation:starsMove 65s linear infinite reverse;

  opacity:.5;
}

.stars3{
  background-image:
    radial-gradient(circle,rgba(255,240,180,.9) 1.5px,transparent 2.5px);

  background-size:430px 430px;

  animation:twinkle 4s ease-in-out infinite;
}


/* =========================
   月亮
========================= */

.moon{
  position:absolute;

  width:190px;
  height:190px;

  right:11%;
  top:16%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fffdf1,
      #e6e0c8 55%,
      #aaa58f
    );

  box-shadow:
    0 0 40px rgba(240,235,205,.25),
    0 0 120px rgba(120,145,220,.12);

  transition:all 2s ease;

  animation:moonFloat 8s ease-in-out infinite;
}


/* =========================
   日期时间
========================= */

.time{
  position:absolute;

  top:38px;
  right:7%;

  text-align:right;
  z-index:10;
}

#date{
  display:block;

  font-family:Georgia,serif;

  font-size:13px;
  letter-spacing:4px;

  color:#b9bdcf;

  margin-bottom:7px;
}

#clock{
  display:block;

  font-family:Georgia,serif;

  font-size:24px;
  letter-spacing:3px;
}


/* =========================
   主内容
========================= */

.content{
  width:min(1000px,86%);
  margin-left:9%;

  position:relative;
  z-index:5;

  animation:fadeUp 1.4s ease both;
}

.small{
  font-size:10px;
  letter-spacing:7px;

  color:#9fa6c1;

  margin-bottom:35px;
}

h1{
  font-family:Georgia,"Times New Roman",serif;

  font-size:clamp(80px,13vw,170px);

  font-weight:400;

  letter-spacing:-8px;

  line-height:.9;

  margin-bottom:40px;

  text-shadow:
    0 0 40px rgba(170,190,255,.12);
}

.line{
  width:85px;
  height:1px;

  background:#8993bb;

  margin-bottom:30px;
}

.description{
  max-width:520px;

  font-size:15px;

  line-height:2.1;

  color:#a8acbd;

  letter-spacing:1px;
}

.enter{
  display:inline-block;

  margin-top:45px;

  padding:16px 30px;

  border:1px solid rgba(190,200,230,.45);

  color:#eeeef4;

  text-decoration:none;

  font-size:10px;

  letter-spacing:4px;

  transition:.4s;
}

.enter:hover{
  background:#eeeef4;
  color:#080b18;

  transform:translateY(-4px);
}


/* =========================
   Day计数
========================= */

.day{
  position:absolute;

  right:7%;
  bottom:7%;

  font-family:Georgia,serif;

  text-align:right;

  z-index:5;
}

.day-number{
  font-size:85px;

  color:rgba(255,255,255,.07);
}

.day-text{
  font-size:9px;

  letter-spacing:4px;

  color:#858aa1;
}


/* =========================
   第二屏
========================= */

.memory{
  min-height:100vh;

  padding:120px 9%;

  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(100,120,180,.13),
      transparent 30%
    ),
    #070912;

  display:flex;
  align-items:center;
}

.memory-inner{
  width:min(1000px,100%);
  margin:auto;
}

.label{
  font-size:10px;

  letter-spacing:6px;

  color:#7e86a7;

  margin-bottom:35px;
}

.quote{
  font-family:Georgia,serif;

  font-size:clamp(35px,5vw,68px);

  line-height:1.4;

  max-width:900px;
}


/* =========================
   每日信息
========================= */

.daily{
  margin-top:90px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:25px;
}

.card{
  padding:25px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.025);

  backdrop-filter:blur(10px);
}

.card-title{
  font-size:9px;

  letter-spacing:4px;

  color:#777d98;

  margin-bottom:15px;
}

.card-value{
  font-family:Georgia,serif;

  font-size:22px;
}


/* =========================
   每日照片
========================= */

.photo{
  margin-top:25px;

  height:300px;

  border:1px solid rgba(255,255,255,.1);

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.01)
    );

  color:#777d98;

  letter-spacing:4px;

  font-size:10px;
}


/* =========================
   底部
========================= */

.bottom{
  margin-top:80px;

  padding-top:22px;

  border-top:1px solid rgba(255,255,255,.12);

  display:flex;
  justify-content:space-between;

  font-size:9px;

  letter-spacing:4px;

  color:#6f748b;
}


/* =========================
   动画
========================= */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes starsMove{
  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(-100px,60px);
  }
}

@keyframes twinkle{
  0%,100%{
    opacity:.2;
  }

  50%{
    opacity:.9;
  }
}

@keyframes moonFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-12px);
  }
}


/* =========================
   手机
========================= */

@media(max-width:600px){

  .hero{
    min-height:720px;
  }

  .content{
    width:82%;
    margin-left:9%;
  }

  h1{
    font-size:78px;
    letter-spacing:-5px;
  }

  .moon{
    width:125px;
    height:125px;

    right:-20px;
    top:18%;
  }

  .time{
    top:28px;
    right:8%;
  }

  #date{
    font-size:10px;
    letter-spacing:2px;
  }

  #clock{
    font-size:19px;
  }

  .day-number{
    font-size:65px;
  }

  .memory{
    padding:100px 10%;
  }

  .quote{
    font-size:34px;
  }

  .daily{
    grid-template-columns:1fr;
  }

  .photo{
    height:220px;
  }

  .bottom{
    flex-direction:column;
    gap:14px;
  }
}
</style>
</head>


<body>


<section class="hero">

  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="moon" id="moon"></div>


  <!-- 自动日期和时间 -->

  <div class="time">

    <span id="date"></span>

    <span id="clock"></span>

  </div>


  <div class="content">

    <div class="small">
      A QUIET PLACE
    </div>

    <h1>圆落星</h1>

    <div class="line"></div>

    <div class="description">

      把喜欢的人、事、照片和那些<br>

      不想忘记的瞬间，慢慢留在这里。

    </div>

    <a href="#memory" class="enter">
      ENTER MY WORLD →
    </a>

  </div>


  <!-- 自动Day -->

  <div class="day">

    <div
      class="day-number"
      id="dayNumber"
    >
      001
    </div>

    <div class="day-text">
      DAYS OF MEMORY
    </div>

  </div>

</section>



<section
  class="memory"
  id="memory"
>

  <div class="memory-inner">

    <div class="label">
      TODAY
    </div>


    <div
      class="quote"
      id="quote"
    >
      “有些瞬间不需要被解释，<br>
      只需要被好好留下。”
    </div>


    <div class="daily">


      <!-- 月相 -->

      <div class="card">

        <div class="card-title">
          MOON
        </div>

        <div
          class="card-value"
          id="moonPhase"
        >
          —
        </div>

      </div>


      <!-- 季节 -->

      <div class="card">

        <div class="card-title">
          SEASON
        </div>

        <div
          class="card-value"
          id="season"
        >
          —
        </div>

      </div>


      <!-- 天气接口 -->

      <div class="card">

        <div class="card-title">
          WEATHER
        </div>

        <div
          class="card-value"
          id="weather"
        >
          —
        </div>

      </div>

    </div>


    <!-- 每日照片位置 -->

    <div
      class="photo"
      id="dailyPhoto"
    >
      DAILY PHOTO
    </div>


    <div class="bottom">

      <span>
        A PLACE FOR MEMORY
      </span>

      <span>
        2026
      </span>

    </div>

  </div>

</section>



<script>

/* =========================
   每日自动数据
========================= */

const now = new Date();


/* 中国日期 */

const chinaDate =
  new Intl.DateTimeFormat(
    "zh-CN",
    {
      timeZone:"Asia/Shanghai",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  )
  .format(now)
  .replace(/\//g,".");


/* 中国时间 */

function updateClock(){

  const current = new Date();

  const time =
    new Intl.DateTimeFormat(
      "zh-CN",
      {
        timeZone:"Asia/Shanghai",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    )
    .format(current);

  document.getElementById("clock")
    .textContent=time;

}


document.getElementById("date")
  .textContent=chinaDate;

updateClock();

setInterval(updateClock,1000);


/* =========================
   Day计数
========================= */

const startDate =
  new Date("2026-01-01T00:00:00");

const today =
  new Date();

const days =
  Math.floor(
    (today-startDate)
    /(1000*60*60*24)
  )+1;

document.getElementById("dayNumber")
  .textContent=
  String(days).padStart(3,"0");


/* =========================
   每日一句
========================= */

const quotes=[

  "“有些瞬间不需要被解释，<br>只需要被好好留下。”",

  "“慢一点，也没关系。”",

  "“今天的风，也值得记住。”",

  "“生活不必喧哗，自有它的光。”",

  "“喜欢的东西，就好好收藏。”",

  "“愿每一天都有值得记住的瞬间。”",

  "“安静下来，听听自己的心。”",

  "“日子很长，慢慢生活。”",

  "“有些美好，只适合留在记忆里。”",

  "“今晚的星星，也在替你保存秘密。”"

];

const quoteIndex =
  Math.floor(
    (Date.now() / 86400000)
  ) % quotes.length;

document.getElementById("quote")
  .innerHTML=quotes[quoteIndex];


/* =========================
   季节自动变化
========================= */

const month =
  new Date().getMonth()+1;

let season="";

if(month>=3 && month<=5){
  season="SPRING · 春";
}

else if(month>=6 && month<=8){
  season="SUMMER · 夏";
}

else if(month>=9 && month<=11){
  season="AUTUMN · 秋";
}

else{
  season="WINTER · 冬";
}

document.getElementById("season")
  .textContent=season;


/* =========================
   月相
========================= */

const lunarCycle=29.530588;

const knownNewMoon=
  new Date("2026-01-18T19:52:00");

const daysSince=
  (new Date()-knownNewMoon)
  /(1000*60*60*24);

let moonAge=
  daysSince%lunarCycle;

if(moonAge<0){
  moonAge+=lunarCycle;
}

let moonName="";

if(moonAge<1.85){
  moonName="🌑 新月";
}

else if(moonAge<7.38){
  moonName="🌒 娥眉月";
}

else if(moonAge<9.23){
  moonName="🌓 上弦月";
}

else if(moonAge<14.77){
  moonName="🌔 盈凸月";
}

else if(moonAge<16.62){
  moonName="🌕 满月";
}

else if(moonAge<22.15){
  moonName="🌖 亏凸月";
}

else if(moonAge<24.00){
  moonName="🌗 下弦月";
}

else{
  moonName="🌘 残月";
}

document.getElementById("moonPhase")
  .textContent=moonName;


/* =========================
   根据时间改变氛围
========================= */

const hour =
  new Date().getHours();

const root =
  document.documentElement;

if(hour>=6 && hour<11){

  root.style.setProperty(
    "--bg1","#18233b"
  );

  root.style.setProperty(
    "--bg2","#0d1428"
  );

  root.style.setProperty(
    "--bg3","#19243d"
  );

  root.style.setProperty(
    "--glow","rgba(170,190,240,.22)"
  );

}

else if(hour>=11 && hour<17){

  root.style.setProperty(
    "--bg1","#172033"
  );

  root.style.setProperty(
    "--bg2","#0b1121"
  );

  root.style.setProperty(
    "--bg3","#202b42"
  );

  root.style.setProperty(
    "--glow","rgba(200,210,255,.18)"
  );

}

else if(hour>=17 && hour<21){

  root.style.setProperty(
    "--bg1","#261b2e"
  );

  root.style.setProperty(
    "--bg2","#0c1020"
  );

  root.style.setProperty(
    "--bg3","#321d2c"
  );

  root.style.setProperty(
    "--glow","rgba(230,150,180,.16)"
  );

}

else{

  root.style.setProperty(
    "--bg1","#050711"
  );

  root.style.setProperty(
    "--bg2","#03040b"
  );

  root.style.setProperty(
    "--bg3","#11152a"
  );

  root.style.setProperty(
    "--glow","rgba(100,126,200,.20)"
  );

}


/* =========================
   天气占位
   以后可以接真实天气API
========================= */

document.getElementById("weather")
  .textContent="Weather · Soon";


/* =========================
   每日照片占位
   以后可以放你的照片
========================= */

const photo=document.getElementById(
  "dailyPhoto"
);

photo.textContent=
  "YOUR DAILY MEMORY";

</script>

</body>
</html>
