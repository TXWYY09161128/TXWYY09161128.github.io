<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星 · 梦幻星空主页</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
font-family:"Microsoft YaHei",sans-serif;
color:white;
overflow-x:hidden;

background:
radial-gradient(circle at 20% 20%,rgba(168,85,247,.5),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(59,130,246,.45),transparent 35%),
linear-gradient(#020617,#0b1026);
}


/* 星空 */

.stars{
position:fixed;
inset:0;
background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(#fff 1px,transparent 1px);

background-size:
50px 50px,
90px 90px;

background-position:
0 0,
40px 40px;

animation:moveStars 25s linear infinite;

opacity:.45;
z-index:-3;
}


@keyframes moveStars{

from{
transform:translateY(0);
}

to{
transform:translateY(120px);
}

}



/* 星云 */

.nebula{

position:fixed;

width:500px;
height:500px;

border-radius:50%;

background:#8b5cf6;

filter:blur(150px);

opacity:.25;

top:20%;
left:30%;

animation:float 8s infinite alternate;

z-index:-2;

}


@keyframes float{

from{
transform:translate(0,0);
}

to{
transform:translate(100px,-80px);
}

}


/* 月亮 */

.moon{

position:fixed;

right:80px;
top:80px;

width:120px;
height:120px;

border-radius:50%;

background:#fff;

box-shadow:

0 0 30px #fff,
0 0 80px #93c5fd;

}


.container{

max-width:900px;

margin:auto;

padding:30px;

}


nav{

display:flex;

justify-content:space-between;

align-items:center;

}


.logo{

font-size:26px;

font-weight:bold;

}


.nav-btn{

color:white;

text-decoration:none;

border:1px solid rgba(255,255,255,.3);

padding:10px 22px;

border-radius:30px;

}


.hero{

height:75vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

}


.hero h1{

font-size:70px;

letter-spacing:8px;

background:

linear-gradient(
90deg,
#fff,
#e9d5ff,
#60a5fa
);

-webkit-background-clip:text;

color:transparent;


animation:glow 2s infinite alternate;

}


@keyframes glow{

from{

filter:drop-shadow(0 0 15px #a855f7);

}

to{

filter:drop-shadow(0 0 45px #38bdf8);

}

}
.hero p{

margin-top:25px;

font-size:20px;

line-height:2;

color:#e2e8f0;

}


.button{

margin-top:35px;

padding:15px 35px;

border-radius:40px;

background:white;

color:#111;

text-decoration:none;

font-weight:bold;

box-shadow:0 0 30px rgba(255,255,255,.5);

}



.card{

margin-top:35px;

padding:35px;

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

border-radius:30px;

backdrop-filter:blur(15px);

box-shadow:

0 0 40px rgba(0,0,0,.3);

}


.card h2{

font-size:28px;

margin-bottom:15px;

}


.card p{

font-size:17px;

line-height:2;

color:#e5e7eb;

}


footer{

text-align:center;

padding:50px 0;

color:#aaa;

}



/* 手机 */

@media(max-width:600px){

.hero h1{

font-size:42px;

letter-spacing:4px;

}


.moon{

width:70px;

height:70px;

right:30px;

top:70px;

}

}

</style>

</head>


<body>


<div class="stars"></div>

<div class="nebula"></div>

<div class="moon"></div>


<div class="container">


<nav>

<div class="logo">
🌙 圆落星
</div>


<a class="nav-btn" href="#about">
关于我
</a>

</nav>



<section class="hero">


<h1>
圆落星
</h1>


<p>

追逐星光 · 热爱生活<br>

欢迎来到我的梦幻星空

</p>


<a class="button" href="#about">

进入我的世界

</a>


</section>



<section class="card" id="about">

<h2>
✨ 关于我
</h2>

<p>

我是圆落星。<br>

在浩瀚宇宙中寻找属于自己的光，

记录想法、作品和美好瞬间。

</p>

</section>



<section class="card">

<h2>
🌌 我的作品
</h2>

<p>

摄影 · 创意设计 · AI创作 · 个人项目

<br>

这里会展示我的探索和创造。

</p>

</section>
<section class="card">

<h2>
⭐ 我的兴趣
</h2>

<p>

🌙 星空探索<br>

🎨 创意设计<br>

💻 科技与未来<br>

📷 记录生活

</p>

</section>



<section class="card">

<h2>
📩 联系我
</h2>

<p>

邮箱：你的邮箱<br>

社交账号：你的账号

</p>

</section>



<footer>

© 2026 圆落星 · 梦幻星空主页

</footer>


</div>


</body>

</html>
