<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星 · A QUIET PLACE</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    background:#050812;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",Arial,sans-serif;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%,rgba(70,95,160,.28),transparent 38%),
      linear-gradient(180deg,#02040b 0%,#071021 60%,#0b1324 100%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%,#fff,transparent),
      radial-gradient(1px 1px at 25% 70%,#fff,transparent),
      radial-gradient(2px 2px at 40% 30%,#fff,transparent),
      radial-gradient(1px 1px at 60% 15%,#fff,transparent),
      radial-gradient(1px 1px at 75% 55%,#fff,transparent),
      radial-gradient(2px 2px at 90% 25%,#fff,transparent),
      radial-gradient(1px 1px at 82% 85%,#fff,transparent),
      radial-gradient(1px 1px at 18% 88%,#fff,transparent);
    animation:twinkle 5s ease-in-out infinite alternate;
    opacity:.7;
}

@keyframes twinkle{
    from{opacity:.35;transform:scale(1)}
    to{opacity:.9;transform:scale(1.02)}
}

.moon{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:#fff;
    top:12%;
    right:13%;
    box-shadow:0 0 50px rgba(255,255,255,.35);
}

.moon:after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:#071021;
    left:-28px;
    top:-12px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:850px;
    padding:30px;
}

.eyebrow{
    letter-spacing:6px;
    font-size:13px;
    opacity:.65;
    margin-bottom:22px;
}

h1{
    font-size:clamp(52px,10vw,110px);
    font-weight:300;
    letter-spacing:10px;
    margin:0 0 18px;
}

.name{
    font-size:clamp(24px,4vw,42px);
    letter-spacing:12px;
    font-weight:300;
    margin-bottom:28px;
}

.desc{
    color:rgba(255,255,255,.7);
    line-height:2;
    font-size:15px;
}

.enter{
    display:inline-block;
    margin-top:35px;
    padding:14px 28px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50px;
    color:#fff;
    text-decoration:none;
    letter-spacing:3px;
    transition:.3s;
}

.enter:hover{
    background:#fff;
    color:#071021;
}

.datetime{
    margin-top:30px;
    font-size:14px;
    letter-spacing:3px;
    opacity:.75;
}

.day-counter{
    margin-top:14px;
    font-size:12px;
    letter-spacing:2px;
    opacity:.45;
}

section{
    position:relative;
    padding:110px 7vw;
    background:#080d19;
}

.section-title{
    font-size:12px;
    letter-spacing:5px;
    opacity:.45;
    margin-bottom:22px;
}

.quote{
    font-size:clamp(25px,4vw,48px);
    font-weight:300;
    line-height:1.5;
    max-width:900px;
    margin-bottom:55px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:90px;
}

.info-card{
    padding:28px;
    min-height:140px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(10px);
}

.info-label{
    font-size:11px;
    letter-spacing:3px;
    opacity:.4;
    margin-bottom:18px;
}

.info-value{
    font-size:19px;
    line-height:1.7;
}

.photo-title{
    font-size:30px;
    font-weight:300;
    letter-spacing:4px;
    margin-bottom:30px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.photo-card{
    overflow:hidden;
    background:#101624;
    aspect-ratio:4/5;
}

.photo-card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .7s ease;
}

.photo-card:hover img{
    transform:scale(1.04);
}

.photo-message{
    grid-column:1/-1;
    padding:50px 20px;
    text-align:center;
    color:rgba(255,255,255,.45);
    letter-spacing:2px;
}

footer{
    padding:70px 7vw;
    text-align:center;
    background:#050812;
    color:rgba(255,255,255,.35);
    font-size:11px;
    letter-spacing:4px;
}

@media(max-width:700px){
    .moon{
        width:70px;
        height:70px;
        right:8%;
        top:9%;
    }

    .moon:after{
        width:70px;
        height:70px;
        left:-18px;
        top:-8px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .photo-grid{
        grid-template-columns:1fr;
    }

    section{
        padding:80px 6vw;
    }
}
</style>
</head>

<body>

<div class="hero">
    <div class="stars"></div>
    <div class="moon"></div>

    <div class="hero-content">
        <div class="eyebrow">A QUIET PLACE</div>

        <h1>圆落星</h1>

        <div class="desc">
            把喜欢的人、事、照片和那些<br>
            不想忘记的瞬间，慢慢留在这里。
        </div>

        <a class="enter" href="#memories">ENTER MY WORLD →</a>

        <div class="datetime" id="datetime">正在读取时间…</div>

        <div class="day-counter" id="dayCounter"></div>
    </div>
</div>

<section id="memories">

    <div class="section-title">TODAY</div>

    <div class="quote" id="quote"></div>

    <div class="info-grid">

        <div class="info-card">
            <div class="info-label">MOON · 月相</div>
            <div class="info-value" id="moonPhase">正在计算…</div>
        </div>

        <div class="info-card">
            <div class="info-label">SEASON · 季节</div>
            <div class="info-value" id="season">正在读取…</div>
        </div>

        <div class="info-card">
            <div class="info-label">WEATHER · 上海</div>
            <div class="info-value" id="weather">正在读取天气…</div>
        </div>

    </div>

    <div class="photo-title">MY MEMORIES · 我的照片</div>

    <div class="photo-grid" id="photoGrid">
        <div class="photo-message">正在读取照片…</div>
    </div>

</section>

<footer>
    A PLACE FOR MEMORY · 2026
</footer>

<script>

/* =========================
   自动日期 + 时间
========================= */

function updateDateTime(){

    const now = new Date();

    const formatter = new Intl.DateTimeFormat(
        "zh-CN",
        {
            timeZone:"Asia/Shanghai",
            year:"numeric",
            month:"long",
            day:"numeric",
            weekday:"long",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    );

    document.getElementById("datetime").textContent =
        formatter.format(now);
}

updateDateTime();
setInterval(updateDateTime,1000);


/* =========================
   Day Counter
========================= */

const startDate = new Date("2026-01-01T00:00:00");

function updateDayCounter(){

    const now = new Date();

    const diff = Math.floor(
        (now - startDate) / 86400000
    ) + 1;

    document.getElementById("dayCounter").textContent =
        "DAY " + diff;
}

updateDayCounter();


/* =========================
   每日一句
========================= */

const quotes = [
    "愿你今天也有值得记住的瞬间。",
    "慢一点，也没有关系。",
    "生活值得被认真收藏。",
    "愿喜欢的人和事，都留在记忆里。",
    "有些瞬间，值得一直保存。",
    "今天也好好生活。",
    "把普通的日子，过成自己的故事。",
    "愿每一次回望，都觉得值得。"
];

const today = new Date();

const quoteIndex =
    Math.floor(
        Date.UTC(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        ) / 86400000
    ) % quotes.length;

document.getElementById("quote").textContent =
    "“" + quotes[quoteIndex] + "”";


/* =========================
   季节
========================= */

function getSeason(){

    const month = new Date().getMonth() + 1;

    if(month >= 3 && month <= 5)
        return "SPRING · 春";

    if(month >= 6 && month <= 8)
        return "SUMMER · 夏";

    if(month >= 9 && month <= 11)
        return "AUTUMN · 秋";

    return "WINTER · 冬";
}

document.getElementById("season").textContent =
    getSeason();


/* =========================
   月相
========================= */

function getMoonPhase(){

    const knownNewMoon =
        new Date("2000-01-06T18:14:00Z");

    const now = new Date();

    const days =
        (now - knownNewMoon) / 86400000;

    const cycle = 29.53058867;

    const phase =
        ((days % cycle) + cycle) % cycle;

    if(phase < 1.85)
        return "新月 · New Moon";

    if(phase < 7.38)
        return "娥眉月 · Waxing Crescent";

    if(phase < 9.23)
        return "上弦月 · First Quarter";

    if(phase < 14.77)
        return "盈凸月 · Waxing Gibbous";

    if(phase < 16.61)
        return "满月 · Full Moon";

    if(phase < 22.15)
        return "亏凸月 · Waning Gibbous";

    if(phase < 24)
        return "下弦月 · Last Quarter";

    return "残月 · Waning Crescent";
}

document.getElementById("moonPhase").textContent =
    getMoonPhase();


/* =========================
   上海真实天气
========================= */

async function loadWeather(){

    const weatherBox =
        document.getElementById("weather");

    try{

        const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=31.2304" +
        "&longitude=121.4737" +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&timezone=Asia%2FShanghai";

        const response =
            await fetch(url);

        if(!response.ok)
            throw new Error();

        const data =
            await response.json();

        const current =
            data.current;

        const code =
            current.weather_code;

        const weatherMap = {

            0:"晴天 ☀️",
            1:"基本晴朗 🌤️",
            2:"局部多云 ⛅",
            3:"阴天 ☁️",
            45:"雾 🌫️",
            48:"雾 🌫️",
            51:"小毛毛雨 🌦️",
            53:"毛毛雨 🌦️",
            55:"毛毛雨 🌦️",
            61:"小雨 🌧️",
            63:"中雨 🌧️",
            65:"大雨 🌧️",
            71:"小雪 ❄️",
            73:"中雪 ❄️",
            75:"大雪 ❄️",
            80:"阵雨 🌦️",
            81:"阵雨 🌦️",
            82:"强阵雨 🌧️",
            95:"雷雨 ⛈️",
            96:"雷雨 ⛈️",
            99:"强雷雨 ⛈️"
        };

        const description =
            weatherMap[code] || "天气变化中";

        weatherBox.innerHTML =
            description +
            "<br>" +
            Math.round(current.temperature_2m) +
            "°C · 体感 " +
            Math.round(current.apparent_temperature) +
            "°C" +
            "<br>" +
            "湿度 " +
            Math.round(current.relative_humidity_2m) +
            "% · 风速 " +
            Math.round(current.wind_speed_10m) +
            " km/h";

    }catch(error){

        weatherBox.textContent =
            "天气暂时无法读取，请稍后刷新";
    }
}

loadWeather();

setInterval(loadWeather,600000);


/* =========================
   自动读取照片清单
========================= */

async function loadPhotos(){

    const grid =
        document.getElementById("photoGrid");

    try{

        /*
          photos.yml 会自动生成 photos.json
          文件名可以完全不同
        */

        const response =
            await fetch(
                "photos.json?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error();

        const photos =
            await response.json();

        if(!Array.isArray(photos) || photos.length === 0){

            grid.innerHTML =
                '<div class="photo-message">' +
                'photos 文件夹里暂时没有照片' +
                '</div>';

            return;
        }

        grid.innerHTML = "";

        photos.forEach(function(path){

            const card =
                document.createElement("div");

            card.className =
                "photo-card";

            const img =
                document.createElement("img");

            img.src =
                path + "?v=" + Date.now();

            img.alt =
                "Memory";

            img.loading =
                "lazy";

            img.onerror =
                function(){

                    card.remove();

                };

            card.appendChild(img);

            grid.appendChild(card);

        });

    }catch(error){

        grid.innerHTML =
            '<div class="photo-message">' +
            '照片暂时无法读取，请稍后刷新' +
            '</div>';
    }
}

loadPhotos();

setInterval(loadPhotos,300000);

</script>

</body>
</html>
