<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  background:#f3f0e9;
  color:#24231f;
}

/* 第一屏 */
.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 70% 25%, #ffffff 0%, transparent 28%),
    linear-gradient(135deg,#eeeae1,#dcd6ca);
}

.hero::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  background:#c9bda9;
  opacity:.22;
  filter:blur(2px);
  right:-180px;
  top:-160px;
}

.hero::after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border:1px solid rgba(60,55,45,.18);
  border-radius:50%;
  left:-160px;
  bottom:-140px;
}

.content{
  width:min(1100px,88%);
  position:relative;
  z-index:2;
}

.small{
  font-size:12px;
  letter-spacing:5px;
  color:#777064;
  margin-bottom:28px;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(64px,11vw,150px);
  font-weight:400;
  letter-spacing:-7px;
  line-height:.9;
  margin-bottom:32px;
}

.line{
  width:70px;
  height:1px;
  background:#575247;
  margin-bottom:28px;
}

.description{
  max-width:500px;
  font-size:16px;
  line-height:2;
  color:#625e55;
  letter-spacing:1px;
}

.enter{
  display:inline-block;
  margin-top:45px;
  padding:16px 30px;
  border:1px solid #716b60;
  color:#302e29;
  text-decoration:none;
  font-size:12px;
  letter-spacing:3px;
  transition:.35s;
}

.enter:hover{
  background:#292823;
  color:#f3f0e9;
}

/* 装饰数字 */
.number{
  position:absolute;
  right:8%;
  bottom:8%;
  font-family:Georgia,serif;
  font-size:100px;
  color:rgba(50,47,40,.08);
  z-index:1;
}

/* 第二屏 */
.memory{
  min-height:80vh;
  padding:120px 8%;
  display:flex;
  align-items:center;
  background:#24231f;
  color:#eeeae1;
}

.memory-inner{
  max-width:1000px;
  width:100%;
  margin:auto;
}

.label{
  font-size:11px;
  letter-spacing:5px;
  color:#aaa398;
  margin-bottom:35px;
}

.quote{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(32px,5vw,65px);
  font-weight:400;
  line-height:1.35;
  max-width:850px;
}

.bottom{
  margin-top:80px;
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.18);
  padding-top:20px;
  font-size:11px;
  letter-spacing:3px;
  color:#aaa398;
}

/* 手机 */
@media(max-width:600px){

  .content{
    width:82%;
  }

  h1{
    font-size:72px;
    letter-spacing:-4px;
  }

  .description{
    font-size:14px;
  }

  .memory{
    min-height:75vh;
    padding:90px 10%;
  }

  .quote{
    font-size:32px;
  }

  .bottom{
    margin-top:60px;
    flex-direction:column;
    gap:12px;
  }

  .number{
    font-size:70px;
    right:7%;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="content">

    <div class="small">A QUIET PLACE</div>

    <h1>圆落星</h1>

    <div class="line"></div>

    <div class="description">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </div>

    <a href="#memory" class="enter">
      ENTER MY WORLD →
    </a>

  </div>

  <div class="number">01</div>

</section>


<section class="memory" id="memory">

  <div class="memory-inner">

    <div class="label">TODAY</div>

    <div class="quote">
      “有些瞬间不需要被解释，<br>
      只需要被好好留下。”
    </div>

    <div class="bottom">
      <span>A PLACE FOR MEMORY</span>
      <span>2026</span>
    </div>

  </div>

</section>

</body>
</html>
