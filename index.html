<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星 · A QUIET PLACE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050711;
  color:white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  overflow-x:hidden;
}

/* ================= 星空首页 ================= */

.hero{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,#18213d 0%,#090d1d 42%,#03040b 100%);
}

/* 星星 */

.stars,
.stars2,
.stars3{
  position:absolute;
  inset:0;
  background-repeat:repeat;
  pointer-events:none;
}

.stars{
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px);
  background-size:120px 120px;
  animation:moveStars 35s linear infinite;
  opacity:.65;
}

.stars2{
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 1px,transparent 1.5px);
  background-size:190px 190px;
  animation:moveStars 55s linear infinite reverse;
  opacity:.45;
}

.stars3{
  background-image:
    radial-gradient(circle,rgba(190,210,255,.8) 1px,transparent 1px);
  background-size:260px 260px;
  animation:twinkle 4s ease-in-out infinite alternate;
  opacity:.35;
}

@keyframes moveStars{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(-120px);
  }
}

@keyframes twinkle{
  from{
    opacity:.2;
  }
  to{
    opacity:.65;
  }
}

/* 月亮 */

.moon{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  right:13%;
  top:13%;
  background:
    radial-gradient(circle at 35% 30%,
      #ffffff 0%,
      #e7e9ef 55%,
      #aeb3c2 100%);
  box-shadow:
    0 0 35px rgba(220,230,255,.35),
    0 0 100px rgba(150,180,255,.12);
  animation:moonFloat 7s ease-in-out infinite;
}

@keyframes moonFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
}

/* 时间 */

.time{
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:18px;
  font-size:12px;
  letter-spacing:3px;
  color:rgba(255,255,255,.62);
  z-index:5;
  white-space:nowrap;
}

/* 主内容 */

.content{
  position:relative;
  z-index:3;
  text-align:center;
  padding:20px;
}

.small{
  font-size:11px;
  letter-spacing:6px;
  color:rgba(255,255,255,.55);
  margin-bottom:22px;
}

h1{
  font-size:clamp(54px,10vw,110px);
  font-weight:300;
  letter-spacing:15px;
  margin-left:15px;
  text-shadow:
    0 0 30px rgba(255,255,255,.15);
}

.line{
  width:55px;
  height:1px;
  background:rgba(255,255,255,.4);
  margin:28px auto;
}

.description{
  font-size:14px;
  line-height:2.2;
  letter-spacing:2px;
  color:rgba(255,255,255,.66);
}

.enter{
  display:inline-block;
  margin-top:42px;
  padding:13px 28px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:40px;
  color:white;
  text-decoration:none;
  font-size:11px;
  letter-spacing:3px;
  transition:.35s;
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(8px);
}

.enter:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.55);
  transform:translateY(-3px);
}

/* 天数 */

.day{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  z-index:3;
}

.day-number{
  font-size:26px;
  letter-spacing:5px;
  font-weight:200;
}

.day-text{
  font-size:8px;
  letter-spacing:3px;
  color:rgba(255,255,255,.4);
  margin-top:6px;
}

/* ================= 记忆区 ================= */

.memory{
  min-height:100vh;
  padding:110px 20px 60px;
  background:
    radial-gradient(circle at 50% 0%,#131a31 0%,#070914 45%,#03040a 100%);
}

.memory-inner{
  width:min(900px,100%);
  margin:auto;
}

.label{
  font-size:10px;
  letter-spacing:5px;
  color:rgba(255,255,255,.4);
  margin-bottom:28px;
}

.quote{
  font-size:clamp(25px,4vw,42px);
  font-weight:300;
  line-height:1.8;
  letter-spacing:2px;
  margin-bottom:65px;
}

/* 数据卡 */

.daily{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  min-height:145px;
  padding:25px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(15px);
  border-radius:18px;
  transition:.35s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);
}

.card-title{
  font-size:9px;
  letter-spacing:4px;
  color:rgba(255,255,255,.38);
  margin-bottom:18px;
}

.card-value{
  font-size:18px;
  line-height:1.7;
  font-weight:300;
}

.weather-city{
  font-size:10px;
  letter-spacing:3px;
  color:rgba(255,255,255,.42);
  margin-bottom:5px;
}

.weather-detail{
  font-size:10px;
  line-height:1.8;
  color:rgba(255,255,255,.45);
  margin-top:5px;
}

.weather-temp{
  font-size:28px;
  letter-spacing:1px;
}

/* 每日照片 */

.photo{
  height:360px;
  margin-top:60px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.01)
    );
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.25);
  letter-spacing:5px;
  font-size:10px;
}

/* 底部 */

.bottom{
  display:flex;
  justify-content:space-between;
  margin-top:80px;
  padding-top:25px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:9px;
  letter-spacing:3px;
  color:rgba(255,255,255,.3);
}

/* 手机 */

@media(max-width:650px){

  .time{
    top:25px;
    font-size:9px;
    letter-spacing:2px;
    gap:10px;
  }

  .moon{
    width:90px;
    height:90px;
    right:9%;
    top:12%;
  }

  h1{
    font-size:60px;
    letter-spacing:9px;
  }

  .description{
    font-size:12px;
    letter-spacing:1px;
  }

  .daily{
    grid-template-columns:1fr;
  }

  .card{
    min-height:125px;
  }

  .photo{
    height:260px;
  }

  .bottom{
    font-size:8px;
  }
}
</style>
</head>


<body>

<!-- ================= 首页 ================= -->

<section class="hero">

  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="moon"></div>

  <!-- 自动日期 + 中国时间 -->
  <div class="time">
    <span id="date">2026.01.01</span>
    <span id="clock">00:00:00</span>
  </div>

  <div class="content">

    <div class="small">A QUIET PLACE</div>

    <h1>圆落星</h1>

    <div class="line"></div>

    <div class="description">
      把喜欢的人、事、照片和那些<br>
      不想忘记的瞬间，慢慢留在这里。
    </div>

    <a href="#memory" class="enter">
      ENTER MY WORLD →
    </a>

  </div>

  <div class="day">
    <div class="day-number" id="dayNumber">001</div>
    <div class="day-text">DAYS OF MEMORY</div>
  </div>

</section>


<!-- ================= 记忆 ================= -->

<section class="memory" id="memory">

  <div class="memory-inner">

    <div class="label">TODAY</div>

    <div class="quote" id="quote">
      “有些瞬间不需要被解释，<br>
      只需要被好好留下。”
    </div>


    <div class="daily">

      <!-- 月亮 -->

      <div class="card">

        <div class="card-title">
          MOON
        </div>

        <div
          class="card-value"
          id="moonPhase">
          —
        </div>

      </div>


      <!-- 季节 -->

      <div class="card">

        <div class="card-title">
          SEASON
        </div>

        <div
          class="card-value"
          id="season">
          —
        </div>

      </div>


      <!-- 上海天气 -->

      <div class="card">

        <div class="card-title">
          WEATHER
        </div>

        <div class="weather-city">
          SHANGHAI · 上海
        </div>

        <div
          class="card-value"
          id="weather">
          正在获取…
        </div>

        <div
          class="weather-detail"
          id="weatherDetail">
        </div>

      </div>

    </div>


    <div class="photo">
      DAILY PHOTO
    </div>


    <div class="bottom">
      <span>A PLACE FOR MEMORY</span>
      <span>2026</span>
    </div>

  </div>

</section>


<script>

/* ================= 自动日期时间 ================= */

function updateClock(){

  const now = new Date();

  const date = new Intl.DateTimeFormat(
    "zh-CN",
    {
      timeZone:"Asia/Shanghai",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"short"
    }
  ).format(now);

  const time = new Intl.DateTimeFormat(
    "zh-CN",
    {
      timeZone:"Asia/Shanghai",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }
  ).format(now);

  document.getElementById("date").textContent =
    date;

  document.getElementById("clock").textContent =
    time;
}

updateClock();

setInterval(updateClock,1000);


/* ================= 2026 天数 ================= */

function updateDay(){

  const now = new Date();

  const start = new Date("2026-01-01T00:00:00");

  const diff =
    Math.floor(
      (now-start)/(1000*60*60*24)
    ) + 1;

  document.getElementById("dayNumber")
    .textContent =
    String(diff).padStart(3,"0");
}

updateDay();


/* ================= 每日文字 ================= */

const quotes = [

  "有些瞬间不需要被解释，<br>只需要被好好留下。",

  "慢一点，也没关系。<br>喜欢的东西值得等待。",

  "愿每一个普通的日子，<br>都有一点值得记住的光。",

  "世界很大，<br>也要记得给自己留一个安静的角落。",

  "今天看到的星星，<br>也是属于今天的。",

  "有些记忆不会消失，<br>它只是安静地住在那里。",

  "喜欢本身，<br>就是一件很浪漫的事情。",

  "愿你永远拥有，<br>重新开始的勇气。"

];

function updateQuote(){

  const day =
    Math.floor(
      Date.now()/(1000*60*60*24)
    );

  const index =
    day % quotes.length;

  document.getElementById("quote")
    .innerHTML =
    "“" + quotes[index] + "”";
}

updateQuote();


/* ================= 季节 ================= */

function updateSeason(){

  const month =
    new Date().getMonth()+1;

  let season="";

  if(month>=3 && month<=5){
    season="SPRING · 春";
  }
  else if(month>=6 && month<=8){
    season="SUMMER · 夏";
  }
  else if(month>=9 && month<=11){
    season="AUTUMN · 秋";
  }
  else{
    season="WINTER · 冬";
  }

  document.getElementById("season")
    .textContent=season;
}

updateSeason();


/* ================= 月相 ================= */

function updateMoon(){

  const knownNewMoon =
    new Date("2024-01-11T11:57:00");

  const now =
    new Date();

  const days =
    (now-knownNewMoon) /
    (1000*60*60*24);

  const cycle =
    29.530588;

  const age =
    ((days % cycle)+cycle)%cycle;

  let phase="";

  if(age<1.85){
    phase="🌑 新月";
  }
  else if(age<7.38){
    phase="🌒 娥眉月";
  }
  else if(age<9.23){
    phase="🌓 上弦月";
  }
  else if(age<14.77){
    phase="🌔 盈凸月";
  }
  else if(age<16.61){
    phase="🌕 满月";
  }
  else if(age<22.15){
    phase="🌖 亏凸月";
  }
  else if(age<24){
    phase="🌗 下弦月";
  }
  else{
    phase="🌘 残月";
  }

  document.getElementById("moonPhase")
    .textContent=phase;
}

updateMoon();


/* ================= 上海真实天气 ================= */

/*
  上海坐标：
  纬度 31.2304
  经度 121.4737

  使用 Open-Meteo
  不需要 API Key
*/

const SHANGHAI_LAT = 31.2304;
const SHANGHAI_LON = 121.4737;


/* 天气代码转换 */

function getWeatherInfo(code){

  if(code === 0){
    return {
      icon:"☀️",
      text:"晴"
    };
  }

  if([1,2,3].includes(code)){
    return {
      icon:"⛅",
      text:"多云"
    };
  }

  if([45,48].includes(code)){
    return {
      icon:"🌫️",
      text:"雾"
    };
  }

  if([51,53,55].includes(code)){
    return {
      icon:"🌦️",
      text:"毛毛雨"
    };
  }

  if([56,57].includes(code)){
    return {
      icon:"🌧️",
      text:"冻雨"
    };
  }

  if([61,63,65].includes(code)){
    return {
      icon:"🌧️",
      text:"下雨"
    };
  }

  if([66,67].includes(code)){
    return {
      icon:"🌧️",
      text:"冻雨"
    };
  }

  if([71,73,75,77].includes(code)){
    return {
      icon:"❄️",
      text:"下雪"
    };
  }

  if([80,81,82].includes(code)){
    return {
      icon:"🌦️",
      text:"阵雨"
    };
  }

  if([85,86].includes(code)){
    return {
      icon:"🌨️",
      text:"阵雪"
    };
  }

  if(code === 95){
    return {
      icon:"⛈️",
      text:"雷雨"
    };
  }

  if([96,99].includes(code)){
    return {
      icon:"⛈️",
      text:"雷雨冰雹"
    };
  }

  return {
    icon:"🌤️",
    text:"天气未知"
  };
}


/* 获取上海天气 */

async function loadWeather(){

  const weather =
    document.getElementById("weather");

  const detail =
    document.getElementById("weatherDetail");

  try{

    weather.textContent =
      "正在获取…";

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + SHANGHAI_LAT +
      "&longitude=" + SHANGHAI_LON +
      "&current=" +
      "temperature_2m," +
      "relative_humidity_2m," +
      "apparent_temperature," +
      "weather_code," +
      "wind_speed_10m" +
      "&timezone=Asia%2FShanghai";

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error("Weather error");
    }

    const data =
      await response.json();

    const current =
      data.current;

    const info =
      getWeatherInfo(
        current.weather_code
      );

    weather.innerHTML =
      info.icon +
      " " +
      info.text +
      "<br>" +
      "<span class='weather-temp'>" +
      Math.round(
        current.temperature_2m
      ) +
      "°C" +
      "</span>";

    detail.innerHTML =
      "体感 " +
      Math.round(
        current.apparent_temperature
      ) +
      "° · 湿度 " +
      Math.round(
        current.relative_humidity_2m
      ) +
      "% · 风 " +
      Math.round(
        current.wind_speed_10m
      ) +
      " km/h";

  }
  catch(error){

    weather.textContent =
      "天气暂时无法获取";

    detail.textContent =
      "请稍后刷新页面";

    console.log(error);
  }
}


/* 第一次打开网站立即获取 */

loadWeather();


/* 每 10 分钟自动更新一次 */

setInterval(
  loadWeather,
  10 * 60 * 1000
);


/* ================= 根据时间改变星空 ================= */

function updateTimeTheme(){

  const hour =
    new Date().getHours();

  const hero =
    document.querySelector(".hero");

  if(hour>=6 && hour<18){

    hero.style.background =
      "radial-gradient(circle at 50% 45%,#18233f 0%,#0a1022 45%,#040610 100%)";

  }
  else{

    hero.style.background =
      "radial-gradient(circle at 50% 45%,#18213d 0%,#090d1d 42%,#03040b 100%)";

  }
}

updateTimeTheme();

setInterval(
  updateTimeTheme,
  60000
);

</script>

</body>
</html>
