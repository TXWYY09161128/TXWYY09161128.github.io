<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆落星</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#eee5da;
    --text:#4a382c;
    --sub:#806b59;
    --accent:#b18a5a;
    --glow:rgba(255,200,130,.35);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,
    "Helvetica Neue",Arial,sans-serif;
    transition:background 2s ease,color 2s ease;
}

/* 背景光 */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(90px);
    z-index:-5;
    transition:background 2s ease;
}

body::before{
    width:60vw;
    height:60vw;
    top:-20%;
    right:-15%;
    background:var(--glow);
    animation:lightMove 12s ease-in-out infinite alternate;
}

body::after{
    width:45vw;
    height:45vw;
    bottom:-20%;
    left:-15%;
    background:var(--glow);
    animation:lightMove2 15s ease-in-out infinite alternate;
}

@keyframes lightMove{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(-60px,80px) scale(1.15)}
}

@keyframes lightMove2{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(80px,-60px) scale(1.2)}
}

/* 顶部 */

header{
    position:relative;
    z-index:10;
    padding:28px 6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    letter-spacing:.15em;
}

.logo{
    font-size:12px;
    font-weight:600;
}

.date{
    font-size:12px;
    opacity:.65;
}

/* 主视觉 */

.hero{
    min-height:78vh;
    padding:7vh 8vw 10vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
}

.hero-text{
    max-width:620px;
    animation:heroIn 1.4s ease both;
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.small-title{
    font-size:12px;
    letter-spacing:.35em;
    color:var(--accent);
    margin-bottom:28px;
}

h1{
    font-size:clamp(70px,12vw,170px);
    line-height:.85;
    letter-spacing:-.07em;
    font-weight:500;
}

.description{
    margin-top:35px;
    max-width:430px;
    color:var(--sub);
    font-size:14px;
    line-height:2;
}

.enter{
    display:inline-block;
    margin-top:35px;
    padding-bottom:9px;
    border-bottom:1px solid var(--accent);
    color:var(--accent);
    font-size:12px;
    letter-spacing:.25em;
    text-decoration:none;
    transition:.4s ease;
}

.enter:hover{
    transform:translateX(8px);
}

/* 人物图片 */

.person{
    width:min(38vw,500px);
    height:min(55vw,650px);
    min-width:280px;
    min-height:380px;
    border-radius:220px 220px 30px 30px;
    position:relative;
    overflow:hidden;
    background:#d9c9b7;
    box-shadow:0 40px 100px rgba(70,45,30,.16);
    animation:personFloat 6s ease-in-out infinite;
    transform-style:preserve-3d;
}

.person img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(.9) contrast(.96);
    transition:transform 1s ease,filter 1s ease;
}

.person:hover img{
    transform:scale(1.04);
}

.person::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        120deg,
        transparent 30%,
        rgba(255,255,255,.25),
        transparent 70%
    );
    transform:translateX(-100%);
    animation:shine 8s ease-in-out infinite;
    pointer-events:none;
}

@keyframes personFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

@keyframes shine{
    0%,45%{transform:translateX(-100%)}
    70%,100%{transform:translateX(100%)}
}

/* 今日 */

.daily{
    padding:10vh 8vw;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    border-top:1px solid rgba(80,60,40,.12);
}

.daily-label{
    font-size:11px;
    letter-spacing:.3em;
    color:var(--accent);
    margin-bottom:25px;
}

.quote{
    font-size:clamp(24px,3vw,42px);
    line-height:1.5;
    font-weight:400;
}

.info{
    color:var(--sub);
    font-size:13px;
    line-height:2.2;
}

/* 滚动动画 */

.reveal{
    opacity:0;
    transform:translateY(40px);
    transition:opacity 1s ease,transform 1s ease;
}

.reveal.show{
    opacity:1;
    transform:translateY(0);
}

/* 飘落效果 */

.effects{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:20;
}

.particle{
    position:absolute;
    top:-50px;
    user-select:none;
    animation:fall linear infinite,sway ease-in-out infinite alternate;
}

@keyframes fall{
    to{
        transform:translateY(115vh) rotate(360deg);
    }
}

@keyframes sway{
    from{margin-left:-30px}
    to{margin-left:30px}
}

/* 四季 */

body.spring{
    --bg:#eee9e0;
    --text:#493f37;
    --sub:#786e63;
    --accent:#a47768;
    --glow:rgba(255,210,220,.4);
}

body.summer{
    --bg:#eee9d8;
    --text:#493d2c;
    --sub:#776a55;
    --accent:#9c7740;
    --glow:rgba(255,220,130,.45);
}

body.autumn{
    --bg:#eee5da;
    --text:#4a382c;
    --sub:#806b59;
    --accent:#b18a5a;
    --glow:rgba(255,190,110,.4);
}

body.winter{
    --bg:#e8edf1;
    --text:#39434a;
    --sub:#68747d;
    --accent:#718b9b;
    --glow:rgba(210,230,245,.5);
}

/* 手机 */

@media(max-width:800px){

    header{
        padding:22px 6vw;
    }

    .hero{
        min-height:auto;
        padding-top:8vh;
        flex-direction:column;
        align-items:flex-start;
    }

    h1{
        font-size:22vw;
    }

    .person{
        width:82vw;
        height:110vw;
        min-width:0;
        min-height:0;
        align-self:center;
        margin-top:20px;
    }

    .daily{
        grid-template-columns:1fr;
        gap:50px;
        padding-top:80px;
    }

    footer{
        flex-direction:column;
        gap:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">YUAN LUO XING</div>
    <div class="date" id="today"></div>
</header>

<main>

<section class="hero">

    <div class="hero-text">

        <div class="small-title" id="seasonTitle">
            A QUIET PLACE
        </div>

        <h1>圆落星</h1>

        <div class="description">
            把喜欢的人、事、照片和那些
            不想忘记的瞬间，慢慢留在这里。
        </div>

        <a href="#daily" class="enter">
            ENTER MY WORLD →
        </a>

    </div>

    <div class="person" id="person">

        <!--
        以后把你的照片命名为 photo.jpg，
        和 index.html 放在同一个 GitHub 文件夹。
        -->

        <img src="photo.jpg" alt="圆落星">

    </div>

</section>


<section class="daily reveal" id="daily">

    <div>

        <div class="daily-label">
            TODAY
        </div>

        <div class="quote" id="dailyQuote">
            把喜欢的事物，慢慢留下来。
        </div>

    </div>

    <div class="info">

        <div>
            今天也值得记录一点什么。
        </div>

        <br>

        <div id="timeMood">
            LIGHT / MEMORY / MOMENT
        </div>

    </div>

</section>

</main>

<footer>
    <span>YUAN LUO XING</span>
    <span id="footerDate"></span>
</footer>

<div class="effects" id="effects"></div>


<script>

/* =========================
   自动日期
========================= */

function updateDate(){

    const now = new Date();

    const month =
        String(now.getMonth()+1).padStart(2,"0");

    const day =
        String(now.getDate()).padStart(2,"0");

    const dateText = month + "." + day;

    document.getElementById("today")
        .textContent = dateText;

    document.getElementById("footerDate")
        .textContent = dateText;
}

updateDate();


/* =========================
   自动四季
========================= */

function updateSeason(){

    const month =
        new Date().getMonth()+1;

    let season;

    if(month >= 3 && month <= 5){
        season = "spring";
    }
    else if(month >= 6 && month <= 8){
        season = "summer";
    }
    else if(month >= 9 && month <= 11){
        season = "autumn";
    }
    else{
        season = "winter";
    }

    document.body.className = season;

    createSeasonEffects(season);
}

updateSeason();


/* =========================
   四季效果
========================= */

function createSeasonEffects(season){

    const container =
        document.getElementById("effects");

    container.innerHTML = "";

    let symbols = [];
    let count = 14;

    if(season === "spring"){
        symbols = ["🌸","🌸","✿"];
        count = 12;
    }

    if(season === "summer"){
        symbols = ["✦","·","✧"];
        count = 12;
    }

    if(season === "autumn"){
        symbols = ["🍁","🍂","🍁"];
        count = 15;
    }

    if(season === "winter"){
        symbols = ["❄","❅","·"];
        count = 22;
    }

    for(let i=0;i<count;i++){

        const p =
            document.createElement("div");

        p.className = "particle";

        p.textContent =
            symbols[
                Math.floor(Math.random()*symbols.length)
            ];

        p.style.left =
            Math.random()*100 + "%";

        p.style.fontSize =
            (10 + Math.random()*18) + "px";

        p.style.opacity =
            .25 + Math.random()*.6;

        p.style.animationDuration =
            (7 + Math.random()*9) + "s";

        p.style.animationDelay =
            (-Math.random()*12) + "s";

        container.appendChild(p);
    }
}


/* =========================
   自动时间氛围
========================= */

function updateTimeMood(){

    const hour =
        new Date().getHours();

    let text;

    if(hour >= 5 && hour < 10){
        text = "SOFT MORNING LIGHT";
    }
    else if(hour >= 10 && hour < 17){
        text = "WARM DAYLIGHT";
    }
    else if(hour >= 17 && hour < 21){
        text = "GOLDEN EVENING";
    }
    else{
        text = "QUIET NIGHT";
    }

    document.getElementById("timeMood")
        .textContent = text;
}

updateTimeMood();


/* =========================
   每天自动换一句话
========================= */

const quotes = [

    "把喜欢的事物，慢慢留下来。",

    "有些瞬间，值得被记住。",

    "今天也可以只做让自己开心的事。",

    "生活不急，慢慢走就好。",

    "把光留给值得的人。",

    "愿每一次记录，都成为以后回看的温柔。",

    "喜欢的东西，就好好珍藏。",

    "普通的一天，也值得拥有一点仪式感。",

    "风吹过的时候，记得抬头看看。",

    "时间会走，但喜欢可以留下。"

];

const dayNumber =
    Math.floor(Date.now()/86400000);

document.getElementById("dailyQuote")
    .textContent =
    quotes[dayNumber % quotes.length];


/* =========================
   鼠标视差
========================= */

const person =
    document.getElementById("person");

document.addEventListener("mousemove",(e)=>{

    if(window.innerWidth <= 800) return;

    const x =
        (e.clientX/window.innerWidth-.5)*12;

    const y =
        (e.clientY/window.innerHeight-.5)*12;

    person.style.marginLeft = x + "px";
    person.style.marginTop = y + "px";

});


/* =========================
   滚动动画
========================= */

const observer =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if(entry.isIntersecting){
                    entry.target.classList.add("show");
                }

            });

        },
        {
            threshold:.15
        }
    );

document.querySelectorAll(".reveal")
    .forEach(el => observer.observe(el));


/* =========================
   自动更新时间
========================= */

setInterval(()=>{

    updateDate();
    updateTimeMood();

},60000);

</script>

</body>
</html>
