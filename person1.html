<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>圆落星 · A QUIET MEMORY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f8f7f2;
    color:#3d3a46;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

.back{
    display:inline-block;
    margin:25px;
    color:#6d5b8c;
    text-decoration:none;
    font-size:14px;
}

.hero{
    max-width:1100px;
    margin:40px auto 80px;
    padding:0 25px;
}

.title{
    font-size:clamp(42px,8vw,90px);
    font-weight:500;
    letter-spacing:-3px;
}

.sub{
    margin-top:15px;
    color:#88818f;
    letter-spacing:3px;
    font-size:12px;
}

.gallery{
    max-width:1100px;
    margin:auto;
    padding:0 25px 100px;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.gallery img{
    width:100%;
    display:block;
    border-radius:4px;
    cursor:pointer;

    transition:.4s;
}

.gallery img:hover{
    transform:scale(1.02);
}


/* =========================
   大图
========================= */

.lightbox{
    position:fixed;
    inset:0;

    background:rgba(20,18,25,.92);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:99;
    padding:20px;
}

.lightbox img{
    max-width:95%;
    max-height:90%;
    object-fit:contain;
}

.lightbox.show{
    display:flex;
}


/* =========================
   手机
========================= */

@media(max-width:700px){

    .gallery{
        grid-template-columns:1fr;
    }

    .hero{
        margin:30px auto 60px;
    }

}
</style>
</head>


<body>


<a class="back" href="index.html">
    ← 返回首页
</a>


<section class="hero">

    <div class="title">
        圆落星
    </div>

    <div class="sub">
        A QUIET MEMORY · 个人相册
    </div>

</section>


<section class="gallery" id="gallery">
</section>


<div class="lightbox" id="lightbox">

    <img id="bigImage">

</div>


<script>

/* =========================
   自动读取现有 photos.json
========================= */

const gallery =
    document.getElementById("gallery");


fetch("photos.json?v=" + Date.now(), {
    cache:"no-store"
})

.then(response => response.json())

.then(photos => {

    photos.forEach(photo => {

        const img =
            document.createElement("img");

        img.src = photo;

        img.loading = "lazy";

        gallery.appendChild(img);

    });

});


/* =========================
   点击照片看大图
========================= */

const lightbox =
    document.getElementById("lightbox");

const bigImage =
    document.getElementById("bigImage");


gallery.addEventListener("click", function(e){

    if(e.target.tagName === "IMG"){

        bigImage.src = e.target.src;

        lightbox.classList.add("show");

    }

});


/* 点击黑色背景关闭 */

lightbox.addEventListener("click", function(){

    lightbox.classList.remove("show");

});

</script>


</body>
</html>
